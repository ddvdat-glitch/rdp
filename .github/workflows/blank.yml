name: 🚀 SEVER AI STV PREMIUM SHARED DRIVE

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng (tính từ lúc job bắt đầu)'
        required: false
        default: '5h40m'
        type: choice
        options:
        - '1h'
        - '3h'
        - '5h40m'
      auto_restart:
        description: '🔁 Tự khởi động phiên mới sau khi hết giờ'
        required: false
        default: true
        type: boolean
      shared_root:
        description: '🗂️ Ổ/directory dùng chung cho tất cả các phiên'
        required: false
        default: 'D:\AISTV-SHARED'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-stv-premium-shared-rdp
  cancel-in-progress: false

jobs:
  Premium-RDP-Setup:
    runs-on: windows-latest
    # Giới hạn tối đa của GitHub là 360. Phiên 5h40m (340) + lưu cuối + dọn dẹp vẫn nằm trong 355.
    timeout-minutes: 355

    env:
      DATA_BRANCH: rdp-data
      DATA_DIR: shared-rdp

    steps:
      # ───────────────────────────────────────────────
      # 1. CHUẨN BỊ
      # ───────────────────────────────────────────────
      - name: 🧱 Chuẩn bị ổ lưu dữ liệu chung
        shell: pwsh
        env:
          INPUT_SHARED_ROOT: ${{ inputs.shared_root }}
          INPUT_DURATION: ${{ inputs.duration }}
        run: |
          # Mốc bắt đầu job (epoch) - thời lượng phiên tính từ mốc này, đã gồm cả thời gian setup
          "JOB_START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV

          switch ($env:INPUT_DURATION) {
              '1h'    { $total = 60;  $display = '1 giờ' }
              '3h'    { $total = 180; $display = '3 giờ' }
              default { $total = 340; $display = '5 giờ 40 phút' }
          }
          "TOTAL_MINUTES=$total" >> $env:GITHUB_ENV
          "DISPLAY_TIME=$display" >> $env:GITHUB_ENV

          $candidates = @()
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_SHARED_ROOT)) {
              $candidates += $env:INPUT_SHARED_ROOT.TrimEnd('\')
          }
          $candidates += 'D:\AISTV-SHARED'
          $candidates += 'E:\AISTV-SHARED'
          $candidates += 'F:\AISTV-SHARED'
          $candidates += (Join-Path $env:RUNNER_TEMP 'AISTV-SHARED')

          $selected = $null
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
              if ($candidate -match '^[A-Za-z]:') {
                  if (Test-Path $candidate.Substring(0, 2)) { $selected = $candidate; break }
              } else {
                  $selected = $candidate; break
              }
          }
          if (-not $selected) { $selected = Join-Path $env:RUNNER_TEMP 'AISTV-SHARED' }

          $sessionDir = Join-Path $selected 'sessions'
          $dataDir    = Join-Path $sessionDir $env:DATA_DIR
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null

          "SHARED_ROOT=$selected" >> $env:GITHUB_ENV
          "SHARED_SESSION_DIR=$sessionDir" >> $env:GITHUB_ENV
          "SHARED_DATA_DIR=$dataDir" >> $env:GITHUB_ENV
          "SHARED_STATE_FILE=$(Join-Path $sessionDir 'rdp-session-state.json')" >> $env:GITHUB_ENV

          Write-Host "✅ Ổ dữ liệu chung: $selected" -ForegroundColor Green

      - name: 🧰 Tạo script lưu dữ liệu (dùng lại nhiều lần)
        shell: pwsh
        run: |
          $script = @'
          param([string]$Reason = 'save')
          $ErrorActionPreference = 'Continue'

          if ($env:DATA_RESTORED -ne '1') {
              Write-Host '⚠️ Dữ liệu chưa được khôi phục xong, bỏ qua lưu để tránh ghi đè dữ liệu cũ' -ForegroundColor Yellow
              exit 0
          }
          $sessionDir = $env:SHARED_SESSION_DIR
          if (-not $sessionDir -or -not (Test-Path $sessionDir)) {
              Write-Host 'ℹ️ Chưa có thư mục dữ liệu, bỏ qua'; exit 0
          }
          if (-not $env:GH_TOKEN) { Write-Host '⚠️ Thiếu GH_TOKEN'; exit 1 }

          # Cập nhật mốc thời gian trong state
          $stateFile = $env:SHARED_STATE_FILE
          if ($stateFile -and (Test-Path $stateFile)) {
              try {
                  $st = Get-Content -Raw $stateFile | ConvertFrom-Json
                  $st.lastUpdatedUtc = (Get-Date).ToUniversalTime().ToString('o')
                  $st | ConvertTo-Json -Depth 5 -Compress | Set-Content -Path $stateFile -Encoding UTF8
              } catch {}
          }

          $work = Join-Path $env:RUNNER_TEMP 'data-push'
          if (Test-Path $work) { Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          robocopy $sessionDir $work /E /XD .git /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
          $global:LASTEXITCODE = 0

          # Git giới hạn 100MB/file
          Get-ChildItem $work -Recurse -File -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Length -gt 95MB } |
              ForEach-Object {
                  Write-Host "⚠️ Bỏ qua file >95MB: $($_.FullName.Substring($work.Length))" -ForegroundColor Yellow
                  Remove-Item $_.FullName -Force
              }

          $repoUrl = "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git"
          $branch  = $env:DATA_BRANCH
          $ok = $false
          try {
              git -C $work init -q 2>&1 | Out-Null
              git -C $work checkout -q -b $branch 2>&1 | Out-Null
              git -C $work config core.autocrlf false
              git -C $work config user.name 'rdp-data'
              git -C $work config user.email 'rdp-data@users.noreply.github.com'
              git -C $work add -A 2>&1 | Out-Null
              git -C $work commit -q -m "$Reason $((Get-Date).ToUniversalTime().ToString('s'))Z" 2>&1 | Out-Null
              git -C $work remote add origin $repoUrl

              for ($try = 1; $try -le 3; $try++) {
                  git -C $work push -q --force origin $branch 2>&1 | Out-Null
                  if ($LASTEXITCODE -eq 0) { $ok = $true; break }
                  Start-Sleep -Seconds 5
              }
          } finally {
              # Xóa thư mục tạm (chứa token trong git config)
              Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          }

          if ($ok) {
              Write-Host "✅ [$Reason] Đã đồng bộ dữ liệu lên nhánh $branch" -ForegroundColor Green
              exit 0
          } else {
              Write-Host "⚠️ [$Reason] Đồng bộ lên nhánh $branch thất bại (dữ liệu vẫn còn trên ổ chung)" -ForegroundColor Yellow
              exit 1
          }
          '@
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'save-data.ps1') -Value $script -Encoding UTF8
          Write-Host '✅ Đã tạo save-data.ps1' -ForegroundColor Green

      # ───────────────────────────────────────────────
      # 2. KHÔI PHỤC DỮ LIỆU TỪ NHÁNH GITHUB
      # ───────────────────────────────────────────────
      - name: ♻️ Khôi phục dữ liệu từ nhánh GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repoUrl = "https://x-access-token:$($env:GH_TOKEN)@github.com/${{ github.repository }}.git"
          $branch  = $env:DATA_BRANCH
          $tmp     = Join-Path $env:RUNNER_TEMP 'rdp-data-repo'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }

          git ls-remote --exit-code --heads $repoUrl $branch 2>&1 | Out-Null
          $code = $LASTEXITCODE

          if ($code -eq 2) {
              Write-Host "ℹ️ Chưa có nhánh $branch - đây là phiên đầu tiên" -ForegroundColor Cyan
              "DATA_RESTORED=1" >> $env:GITHUB_ENV
              exit 0
          }
          if ($code -ne 0) {
              # Dừng hẳn để không ghi đè dữ liệu cũ bằng dữ liệu rỗng
              Write-Host "❌ Không kết nối được GitHub để kiểm tra nhánh $branch" -ForegroundColor Red
              exit 1
          }

          git -c core.autocrlf=false clone --branch $branch --single-branch --depth 1 $repoUrl $tmp 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ Clone nhánh $branch thất bại" -ForegroundColor Red
              exit 1
          }

          robocopy $tmp $env:SHARED_SESSION_DIR /E /XD .git /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
          $global:LASTEXITCODE = 0
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:SHARED_DATA_DIR | Out-Null
          Write-Host "✅ Đã phục hồi dữ liệu từ nhánh $branch" -ForegroundColor Green

          if (Test-Path $env:SHARED_STATE_FILE) {
              try {
                  $state = Get-Content -Raw $env:SHARED_STATE_FILE | ConvertFrom-Json
                  if ($state.password) {
                      "RESTORE_PASS=$($state.password)" >> $env:GITHUB_ENV
                      Write-Host "✅ Đã khôi phục mật khẩu phiên trước" -ForegroundColor Green
                  }
              } catch {
                  Write-Host "⚠️ File state cũ không đọc được, bỏ qua" -ForegroundColor Yellow
              }
          }

          "DATA_RESTORED=1" >> $env:GITHUB_ENV
          exit 0

      # ───────────────────────────────────────────────
      # 3. BANNER
      # ───────────────────────────────────────────────
      - name: 🎯 KHỞI ĐỘNG HỆ THỐNG
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "🤖 AI STV PREMIUM RDP SERVER" -ForegroundColor Yellow
          Write-Host "⚡ Powered by AI STV" -ForegroundColor Green
          Write-Host "🗂️ Shared Drive: $env:SHARED_ROOT" -ForegroundColor Cyan
          Write-Host "🕒 Thời gian: $env:DISPLAY_TIME" -ForegroundColor Magenta
          Write-Host "✅ Hệ thống đã sẵn sàng!" -ForegroundColor Green

      # ───────────────────────────────────────────────
      # 4. CẤU HÌNH RDP
      # ───────────────────────────────────────────────
      - name: 🔧 CẤU HÌNH HỆ THỐNG
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "🛠️  ĐANG CẤU HÌNH HỆ THỐNG" -ForegroundColor Yellow

          $steps = @(
              @{Name="Bật Remote Desktop"; Script={
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
              }},
              @{Name="Cấu hình bảo mật RDP"; Script={
                  $p = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
                  Set-ItemProperty -Path $p -Name 'UserAuthentication' -Value 0 -Force
                  Set-ItemProperty -Path $p -Name 'SecurityLayer' -Value 0 -Force
              }},
              @{Name="Mở port 3389 (chỉ cho dải Tailscale)"; Script={
                  Remove-NetFirewallRule -DisplayName 'RDP-Premium' -ErrorAction SilentlyContinue
                  New-NetFirewallRule -DisplayName 'RDP-Premium' -Direction Inbound -Action Allow `
                      -Protocol TCP -LocalPort 3389 -RemoteAddress '100.64.0.0/10' -Profile Any | Out-Null
              }},
              @{Name="Khởi động dịch vụ"; Script={
                  Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue
                  Set-Service -Name UmRdpService -StartupType Automatic -ErrorAction SilentlyContinue
                  Start-Service -Name TermService -ErrorAction SilentlyContinue
                  Start-Service -Name UmRdpService -ErrorAction SilentlyContinue
              }}
          )

          foreach ($step in $steps) {
              try {
                  & $step.Script
                  Write-Host "│ ✅ $($step.Name)" -ForegroundColor Green
              } catch {
                  Write-Host "│ ⚠️  $($step.Name) - bỏ qua lỗi nhỏ: $($_.Exception.Message)" -ForegroundColor Yellow
              }
          }
          Write-Host "🎯 Cấu hình hoàn tất!" -ForegroundColor Green
          exit 0

      # ───────────────────────────────────────────────
      # 5. TẠO TÀI KHOẢN
      # ───────────────────────────────────────────────
      - name: 👤 TẠO TÀI KHOẢN PREMIUM
        shell: pwsh
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.RDP_PASSWORD }}
        run: |
          Write-Host ""
          Write-Host "👤 ĐANG TẠO TÀI KHOẢN PREMIUM" -ForegroundColor Yellow

          function Get-Pick([string]$s) {
              $s[[System.Security.Cryptography.RandomNumberGenerator]::GetInt32($s.Length)]
          }

          function New-PremiumPassword {
              $upper   = 'ABCDEFGHJKLMNPQRSTUVWXYZ'
              $lower   = 'abcdefghijkmnpqrstuvwxyz'
              $numbers = '23456789'
              $all     = $upper + $lower + $numbers
              $chars = @((Get-Pick $upper), (Get-Pick $lower), (Get-Pick $numbers))
              for ($i = 1; $i -le 9; $i++) { $chars += (Get-Pick $all) }
              -join ($chars | Sort-Object { [System.Security.Cryptography.RandomNumberGenerator]::GetInt32([int]::MaxValue) })
          }

          # Ưu tiên: secret RDP_PASSWORD > mật khẩu đã lưu > tạo mới
          if ($env:RDP_PASSWORD_SECRET) {
              $matKhau = $env:RDP_PASSWORD_SECRET; $source = 'secret'
              Write-Host "│ ℹ️  Dùng mật khẩu từ secret RDP_PASSWORD" -ForegroundColor Blue
          } elseif ($env:RESTORE_PASS) {
              $matKhau = $env:RESTORE_PASS; $source = 'restored'
              Write-Host "│ ℹ️  Dùng mật khẩu đã lưu từ phiên trước" -ForegroundColor Blue
          } else {
              $matKhau = New-PremiumPassword; $source = 'generated'
              Write-Host "│ ℹ️  Tạo mật khẩu mới" -ForegroundColor Blue
          }

          $securePass = ConvertTo-SecureString $matKhau -AsPlainText -Force

          if (Get-LocalUser -Name 'AISTV-PREMIUM' -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name 'AISTV-PREMIUM' -ErrorAction SilentlyContinue
              Write-Host "│ ✅ Đã xóa user cũ" -ForegroundColor Green
          }

          try {
              New-LocalUser -Name 'AISTV-PREMIUM' -Password $securePass -AccountNeverExpires -PasswordNeverExpires -Description 'AI STV Premium Account' | Out-Null
              Add-LocalGroupMember -Group 'Administrators' -Member 'AISTV-PREMIUM' -ErrorAction SilentlyContinue
              Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'AISTV-PREMIUM' -ErrorAction SilentlyContinue
              Enable-LocalUser -Name 'AISTV-PREMIUM'
              Write-Host "│ ✅ Đã tạo user & cấp quyền Administrator + RDP" -ForegroundColor Green
          } catch {
              Write-Host "│ ❌ Lỗi tạo user: $($_.Exception.Message)" -ForegroundColor Red
              exit 1
          }

          "RDP_USER=AISTV-PREMIUM" >> $env:GITHUB_ENV
          "RDP_PASS=$matKhau" >> $env:GITHUB_ENV
          "RDP_PASS_SOURCE=$source" >> $env:GITHUB_ENV

          # Shortcut tới thư mục dữ liệu chung trên Desktop (mọi user)
          try {
              $ws  = New-Object -ComObject WScript.Shell
              $lnk = $ws.CreateShortcut('C:\Users\Public\Desktop\AISTV-SHARED.lnk')
              $lnk.TargetPath = $env:SHARED_DATA_DIR
              $lnk.Save()
              Write-Host "│ ✅ Đã tạo shortcut AISTV-SHARED trên Desktop" -ForegroundColor Green
          } catch {
              Write-Host "│ ⚠️  Không tạo được shortcut" -ForegroundColor Yellow
          }

          Write-Host "✅ Tài khoản AISTV-PREMIUM đã sẵn sàng" -ForegroundColor Green
          exit 0

      - name: 🔍 KIỂM TRA QUYỀN HỆ THỐNG
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "🔍 KIỂM TRA QUYỀN ĐĂNG NHẬP" -ForegroundColor Yellow

          $user = Get-LocalUser -Name 'AISTV-PREMIUM' -ErrorAction SilentlyContinue
          if (-not $user) { Write-Host "│ ❌ User không tồn tại" -ForegroundColor Red; exit 1 }
          Write-Host "│ ✅ User tồn tại (Enabled: $($user.Enabled))" -ForegroundColor Green

          $isAdmin = (Get-LocalGroupMember -Group 'Administrators' | Where-Object { $_.Name -like '*AISTV-PREMIUM' }).Count -gt 0
          $isRdp   = (Get-LocalGroupMember -Group 'Remote Desktop Users' | Where-Object { $_.Name -like '*AISTV-PREMIUM' }).Count -gt 0
          Write-Host "│ $(if ($isAdmin) {'✅'} else {'❌'}) Quyền Administrator"
          Write-Host "│ $(if ($isRdp) {'✅'} else {'❌'}) Quyền Remote Desktop"

          $svc = Get-Service -Name TermService -ErrorAction SilentlyContinue
          Write-Host "│ $(if ($svc.Status -eq 'Running') {'✅'} else {'❌'}) TermService: $($svc.Status)"
          exit 0

      # ───────────────────────────────────────────────
      # 6. TAILSCALE
      # ───────────────────────────────────────────────
      - name: 🌐 THIẾT LẬP MẠNG PREMIUM
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "🌐 ĐANG THIẾT LẬP KẾT NỐI MẠNG" -ForegroundColor Yellow

          if (-not $env:TAILSCALE_AUTH_KEY) {
              Write-Host "❌ Thiếu secret TAILSCALE_AUTH_KEY" -ForegroundColor Red
              exit 1
          }

          $msiPath = "$env:TEMP\tailscale-premium.msi"
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $msiPath
          Start-Process msiexec.exe -ArgumentList '/i', "`"$msiPath`"", '/quiet', '/norestart' -Wait
          Remove-Item $msiPath -Force -ErrorAction SilentlyContinue
          Write-Host "│ ✅ Đã cài Tailscale" -ForegroundColor Green

          Start-Sleep -Seconds 10
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up "--authkey=$($env:TAILSCALE_AUTH_KEY)" "--hostname=ai-stv-premium-$($env:GITHUB_RUN_ID)" --accept-routes --accept-dns --reset
          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ Lỗi kết nối Tailscale" -ForegroundColor Red
              exit 1
          }
          Write-Host "│ ✅ Kết nối Tailscale thành công" -ForegroundColor Green

          $ip = $null
          for ($i = 0; $i -lt 20; $i++) {
              $out = (& $ts ip -4 2>&1 | Out-String).Trim()
              if ($out -match '^\d+\.\d+\.\d+\.\d+$') { $ip = $out; break }
              Start-Sleep -Seconds 3
          }

          if (-not $ip) {
              Write-Host "❌ Không lấy được IP Tailscale" -ForegroundColor Red
              exit 1
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "✅ Địa chỉ IP: $ip" -ForegroundColor Green
          exit 0

      # ───────────────────────────────────────────────
      # 7. LƯU STATE ĐẦU PHIÊN
      # ───────────────────────────────────────────────
      - name: 💾 Lưu trạng thái phiên vào ổ chung & GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nếu mật khẩu lấy từ secret thì KHÔNG lưu vào repo
          $savePass = if ($env:RDP_PASS_SOURCE -eq 'secret') { $null } else { $env:RDP_PASS }

          $state = [ordered]@{
              user            = 'AISTV-PREMIUM'
              password        = $savePass
              passwordSource  = $env:RDP_PASS_SOURCE
              tailscaleIp     = $env:TAILSCALE_IP
              durationMinutes = [int]$env:TOTAL_MINUTES
              startUtc        = (Get-Date).ToUniversalTime().ToString('o')
              runId           = $env:GITHUB_RUN_ID
              lastUpdatedUtc  = (Get-Date).ToUniversalTime().ToString('o')
          }
          $state | ConvertTo-Json -Depth 5 -Compress | Set-Content -Path $env:SHARED_STATE_FILE -Encoding UTF8

          # Đảm bảo thư mục dữ liệu rỗng vẫn được git lưu
          $keep = Join-Path $env:SHARED_DATA_DIR '.gitkeep'
          if (-not (Test-Path $keep)) { New-Item -ItemType File -Path $keep -Force | Out-Null }

          & (Join-Path $env:RUNNER_TEMP 'save-data.ps1') -Reason 'session-start'
          exit 0

      # ───────────────────────────────────────────────
      # 8. THÔNG TIN KẾT NỐI
      # ───────────────────────────────────────────────
      - name: 🎉 THÔNG TIN KẾT NỐI
        shell: pwsh
        run: |
          $tz    = [System.TimeZoneInfo]::FindSystemTimeZoneById('SE Asia Standard Time')
          $start = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTimeOffset]::FromUnixTimeSeconds([long]$env:JOB_START_EPOCH).UtcDateTime, $tz)
          $end   = $start.AddMinutes([int]$env:TOTAL_MINUTES)

          $passText = if ($env:RDP_PASS_SOURCE -eq 'secret') { '(dùng secret RDP_PASSWORD)' } else { $env:RDP_PASS }

          Write-Host ""
          Write-Host "┌───────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host "│              🎉 KẾT NỐI THÀNH CÔNG!" -ForegroundColor Cyan
          Write-Host "├───────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "│ 🌐  Địa chỉ: $env:TAILSCALE_IP" -ForegroundColor White
          Write-Host "│ 📍  Port: 3389" -ForegroundColor White
          Write-Host "│ 👤  Tài khoản: AISTV-PREMIUM" -ForegroundColor White
          Write-Host "│ 🔐  Mật khẩu: $passText" -ForegroundColor White
          Write-Host "│ 🗂️  Thư mục lưu dữ liệu: $env:SHARED_DATA_DIR" -ForegroundColor White
          Write-Host "│     (hoặc shortcut AISTV-SHARED trên Desktop)" -ForegroundColor White
          Write-Host "│ ⏰  Thời lượng: $env:DISPLAY_TIME" -ForegroundColor White
          Write-Host "│ 🕐  Bắt đầu: $($start.ToString('HH:mm:ss'))" -ForegroundColor White
          Write-Host "│ 🕐  Kết thúc: $($end.ToString('HH:mm:ss'))" -ForegroundColor White
          Write-Host "├───────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "│ 💡  Chỉ file nằm trong thư mục shared-rdp mới được lưu sang phiên sau" -ForegroundColor Yellow
          Write-Host "│ 💡  Tự lưu mỗi 15 phút và lưu lần cuối khi hết giờ" -ForegroundColor Yellow
          Write-Host "└───────────────────────────────────────────┘" -ForegroundColor Cyan
          exit 0

      # ───────────────────────────────────────────────
      # 9. DUY TRÌ PHIÊN + AUTOSAVE
      # ───────────────────────────────────────────────
      - name: ⏳ DUY TRÌ PHIÊN LÀM VIỆC
        id: keepalive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOSAVE_MINUTES: '15'
        run: |
          $tz         = [System.TimeZoneInfo]::FindSystemTimeZoneById('SE Asia Standard Time')
          $endEpoch   = [long]$env:JOB_START_EPOCH + ([long]$env:TOTAL_MINUTES * 60)
          $saveScript = Join-Path $env:RUNNER_TEMP 'save-data.ps1'
          $endLocal   = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTimeOffset]::FromUnixTimeSeconds($endEpoch).UtcDateTime, $tz)

          Write-Host ""
          Write-Host "🔄 BẮT ĐẦU DUY TRÌ PHIÊN LÀM VIỆC..." -ForegroundColor Yellow
          Write-Host "🔗 Kết nối: $env:TAILSCALE_IP" -ForegroundColor Cyan
          Write-Host "🗂️ Dữ liệu: $env:SHARED_DATA_DIR" -ForegroundColor Cyan
          Write-Host "🕐 Kết thúc dự kiến: $($endLocal.ToString('HH:mm:ss'))" -ForegroundColor Green
          Write-Host ""

          $lastSave = Get-Date
          $lastLog  = (Get-Date).AddHours(-1)
          $warned   = $false

          while ($true) {
              $now    = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
              $remain = $endEpoch - $now
              if ($remain -le 0) { break }

              # Log trạng thái mỗi 5 phút
              if (((Get-Date) - $lastLog).TotalMinutes -ge 5) {
                  $svc  = Get-Service -Name TermService -ErrorAction SilentlyContinue
                  $conn = @(Get-NetTCPConnection -LocalPort 3389 -State Established -ErrorAction SilentlyContinue).Count
                  $h = [math]::Floor($remain / 3600); $m = [math]::Floor(($remain % 3600) / 60)
                  Write-Host "[$(Get-Date -Format 'HH:mm:ss')] 📊 RDP: $($svc.Status) | Kết nối: $conn | Còn lại: ${h}h ${m}m" -ForegroundColor Blue
                  $lastLog = Get-Date
              }

              # Tự bật lại TermService nếu bị tắt
              $svc = Get-Service -Name TermService -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -ne 'Running') {
                  Write-Host "🔄 Khởi động lại TermService..." -ForegroundColor Yellow
                  Start-Service -Name TermService -ErrorAction SilentlyContinue
              }

              # Cảnh báo người dùng trước khi hết giờ 5 phút
              if (-not $warned -and $remain -le 300) {
                  try { msg * /TIME:290 "Phien RDP sap het gio (5 phut). Hay luu file vao thu muc shared-rdp!" } catch {}
                  $warned = $true
              }

              # Autosave mỗi N phút (không chạy khi sắp hết giờ vì sẽ có lưu cuối)
              if ((((Get-Date) - $lastSave).TotalMinutes -ge [int]$env:AUTOSAVE_MINUTES) -and $remain -gt 180) {
                  & $saveScript -Reason 'autosave'
                  $global:LASTEXITCODE = 0
                  $lastSave = Get-Date
              }

              Start-Sleep -Seconds ([int][math]::Min(30, [math]::Max(1, $remain)))
          }

          Write-Host ""
          Write-Host "🎯 ĐÃ HẾT THỜI GIAN - TỰ ĐỘNG DỪNG!" -ForegroundColor Red
          exit 0

      # ───────────────────────────────────────────────
      # 10. LƯU CUỐI PHIÊN (luôn chạy, trước khi dọn dẹp)
      # ───────────────────────────────────────────────
      - name: 💾 Lưu dữ liệu cuối phiên
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $saveScript = Join-Path $env:RUNNER_TEMP 'save-data.ps1'
          if (Test-Path $saveScript) {
              & $saveScript -Reason 'session-end'
          } else {
              Write-Host 'ℹ️ Không có script lưu, bỏ qua' -ForegroundColor Cyan
          }
          exit 0

      # ───────────────────────────────────────────────
      # 11. DỌN DẸP
      # ───────────────────────────────────────────────
      - name: 🧹 DỌN DẸP HỆ THỐNG
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "🧹 ĐANG DỌN DẸP HỆ THỐNG..." -ForegroundColor Yellow

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $cleanupSteps = @(
              @{Name='Vô hiệu hóa user'; Script={
                  Disable-LocalUser -Name 'AISTV-PREMIUM' -ErrorAction SilentlyContinue
              }},
              @{Name='Đóng kết nối mạng'; Script={
                  if (Test-Path $ts) {
                      & $ts logout 2>&1 | Out-Null
                      & $ts down 2>&1 | Out-Null
                  }
              }},
              @{Name='Xóa rule firewall'; Script={
                  Remove-NetFirewallRule -DisplayName 'RDP-Premium' -ErrorAction SilentlyContinue
              }},
              @{Name='Khôi phục cài đặt RDP'; Script={
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 1 -Force -ErrorAction SilentlyContinue
                  Stop-Service -Name TermService -Force -ErrorAction SilentlyContinue
              }}
          )

          foreach ($step in $cleanupSteps) {
              try {
                  & $step.Script
                  Write-Host "│ ✅ $($step.Name)" -ForegroundColor Green
              } catch {
                  Write-Host "│ ⚠️  $($step.Name) - đã xử lý an toàn" -ForegroundColor Yellow
              }
          }

          Write-Host "🎉 Dọn dẹp hoàn tất! Hẹn gặp lại! 👋" -ForegroundColor Green
          exit 0

      # ───────────────────────────────────────────────
      # 12. PHIÊN TIẾP THEO
      # Chỉ chạy lại khi phiên trước chạy trọn vẹn đến hết giờ,
      # tránh vòng lặp vô hạn nếu setup bị lỗi (thiếu secret, Tailscale lỗi...).
      # ───────────────────────────────────────────────
      - name: 🔁 Kích hoạt phiên tiếp theo
        if: ${{ always() && inputs.auto_restart && steps.keepalive.outcome == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DURATION: ${{ inputs.duration }}
        run: |
          $wf = [System.IO.Path]::GetFileName(($env:GITHUB_WORKFLOW_REF -split '@')[0])
          Write-Host "Chạy lại workflow: $wf (ref: $env:GITHUB_REF_NAME)" -ForegroundColor Cyan
          gh workflow run $wf --ref $env:GITHUB_REF_NAME -f "duration=$($env:DURATION)" -f auto_restart=true -f "shared_root=$($env:SHARED_ROOT)"
          if ($LASTEXITCODE -ne 0) { throw 'Không kích hoạt được phiên mới' }
          Write-Host "✅ Đã kích hoạt phiên tiếp theo" -ForegroundColor Green
