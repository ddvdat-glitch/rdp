name: 🚀 BOT CUADAT RUNNER

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian chạy'
        required: false
        default: '5h40m'
        type: choice
        options:
        - '1h'
        - '3h'
        - '5h40m'
      port:
        description: '📍 Cổng ứng dụng (PORT)'
        required: false
        default: '3000'
        type: string

jobs:
  Run-Bot:
    runs-on: windows-latest
    timeout-minutes: 340

    env:
      APP_PORT: ${{ github.event.inputs.port }}
      REPO_URL: https://github.com/ddvdat-glitch/botcuadat.git

    steps:
      # 1. CÀI NODE
      - name: 🟢 Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. CLONE + INSTALL
      - name: 📥 Clone & npm install
        run: |
          git clone $env:REPO_URL app
          Set-Location app
          npm install
          Write-Host "✅ npm install xong" -ForegroundColor Green

      # 3. MỞ FIREWALL CHO CỔNG
      - name: 🔓 Mở cổng firewall
        run: |
          netsh advfirewall firewall add rule name="BotApp-In" dir=in action=allow protocol=TCP localport=$env:APP_PORT profile=any

      # 4. TAILSCALE
      - name: 🌐 Thiết lập Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $msiPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msiPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msiPath`"", "/quiet", "/norestart" -Wait
          Start-Sleep -Seconds 10

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=bot-cuadat-$env:GITHUB_RUN_ID --accept-routes --reset

          $ip = $null
          for ($i = 0; $i -lt 20; $i++) {
              $ip = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>&1) | Select-Object -First 1
              if ($ip -match '^\d+\.\d+\.\d+\.\d+$') { break }
              Start-Sleep -Seconds 3
          }
          if ($ip -notmatch '^\d+\.\d+\.\d+\.\d+$') { $ip = "localhost" }
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "✅ Tailscale IP: $ip" -ForegroundColor Green

      # 5. CHẠY npm start + GIỮ PHIÊN
      - name: ▶️ npm start & duy trì
        env:
          PORT: ${{ github.event.inputs.port }}
          APP_PORT: ${{ github.event.inputs.port }}
        run: |
          switch ("${{ github.event.inputs.duration }}") {
              "1h"    { $totalMinutes = 60 }
              "3h"    { $totalMinutes = 180 }
              "5h40m" { $totalMinutes = 335 }   # chừa vài phút cho dọn dẹp
              default { $totalMinutes = 60 }
          }

          $endTime = (Get-Date).AddMinutes($totalMinutes)
          $appDir = Join-Path $PWD "app"

          function Get-Timestamp {
              return (Get-Date).ToString('yyyy-MM-dd HH:mm:ss')
          }

          function Start-App {
              Write-Host "[$(Get-Timestamp)] 🚀 Đang khởi động npm start..." -ForegroundColor Cyan

              # Xóa log cũ
              Remove-Item "$env:TEMP\app.out.log" -Force -ErrorAction SilentlyContinue
              Remove-Item "$env:TEMP\app.err.log" -Force -ErrorAction SilentlyContinue

              $p = Start-Process `
                  -FilePath "npm.cmd" `
                  -ArgumentList "start" `
                  -WorkingDirectory $appDir `
                  -RedirectStandardOutput "$env:TEMP\app.out.log" `
                  -RedirectStandardError "$env:TEMP\app.err.log" `
                  -PassThru

              return $p
          }

          $proc = Start-App

          Start-Sleep -Seconds 8

          Write-Host ""
          Write-Host "┌────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host "│ 🎉 BOT ĐANG CHẠY" -ForegroundColor Cyan
          Write-Host "│ 🌐 Truy cập: http://$($env:TAILSCALE_IP):$($env:APP_PORT)" -ForegroundColor White
          Write-Host "│ ⏰ Kết thúc: $($endTime.ToString('HH:mm:ss'))" -ForegroundColor White
          Write-Host "└────────────────────────────────────────┘" -ForegroundColor Cyan

          # Kiểm tra ngay sau 8 giây
          if ($proc.HasExited) {
              Write-Host ""
              Write-Host "[$(Get-Timestamp)] ❌ npm start ĐÃ CHẾT NGAY KHI KHỞI ĐỘNG!" -ForegroundColor Red
              Write-Host "[$(Get-Timestamp)] ExitCode: $($proc.ExitCode)" -ForegroundColor Red

              Write-Host ""
              Write-Host "===== CHI TIẾT STDOUT (Lỗi Khởi Động) =====" -ForegroundColor Yellow
              Get-Content "$env:TEMP\app.out.log" -Tail 150 -ErrorAction SilentlyContinue

              Write-Host ""
              Write-Host "===== CHI TIẾT STDERR (Lỗi Khởi Động) =====" -ForegroundColor Red
              Get-Content "$env:TEMP\app.err.log" -Tail 150 -ErrorAction SilentlyContinue

              exit 1
          }

          $lastLog = Get-Date

          while ((Get-Date) -lt $endTime) {
              # Tự khởi động lại nếu app chết
              if ($proc.HasExited) {
                  Write-Host ""
                  Write-Host "[$(Get-Timestamp)] ⚠️ Ứng dụng đột ngột dừng! ExitCode: $($proc.ExitCode)" -ForegroundColor Yellow

                  Write-Host "===== CHI TIẾT STDOUT (Sự Cố) =====" -ForegroundColor Yellow
                  Get-Content "$env:TEMP\app.out.log" -Tail 100 -ErrorAction SilentlyContinue

                  Write-Host "===== CHI TIẾT STDERR (Sự Cố) =====" -ForegroundColor Red
                  Get-Content "$env:TEMP\app.err.log" -Tail 100 -ErrorAction SilentlyContinue

                  Write-Host "[$(Get-Timestamp)] 🔄 Đang thử khởi động lại ứng dụng..." -ForegroundColor Cyan

                  $proc = Start-App
                  Start-Sleep -Seconds 5
              }

              # In log app mỗi 60 giây
              if (((Get-Date) - $lastLog).TotalSeconds -ge 60) {
                  Write-Host ""
                  Write-Host "[$(Get-Timestamp)] ----- LOG GẦN NHẤT -----" -ForegroundColor DarkGray

                  $stdoutLines = Get-Content "$env:TEMP\app.out.log" -Tail 30 -ErrorAction SilentlyContinue
                  if ($stdoutLines) {
                      Write-Host "[STDOUT]" -ForegroundColor Gray
                      $stdoutLines | ForEach-Object { Write-Host "  $_" -ForegroundColor White }
                  }

                  $stderrLines = Get-Content "$env:TEMP\app.err.log" -Tail 30 -ErrorAction SilentlyContinue
                  if ($stderrLines) {
                      Write-Host "[STDERR]" -ForegroundColor Red
                      $stderrLines | ForEach-Object { Write-Host "  $_" -ForegroundColor Red }
                  }

                  $left = [math]::Floor(($endTime - (Get-Date)).TotalMinutes)
                  Write-Host "[$(Get-Timestamp)] ⏳ Trạng thái: Đang hoạt động | Thời gian còn lại: khoảng $left phút" -ForegroundColor Blue

                  $lastLog = Get-Date
              }

              Start-Sleep -Seconds 10
          }

          Write-Host "[$(Get-Timestamp)] 🎯 HẾT THỜI GIAN - TỰ ĐỘNG DỪNG PHIÊN!" -ForegroundColor Red

      # 6. DỌN DẸP
      - name: 🧹 Dọn dẹp
        if: always()
        run: |
          Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          & "$env:ProgramFiles\Tailscale\tailscale.exe" down 2>$null
          netsh advfirewall firewall delete rule name="BotApp-In" 2>$null
          Write-Host "🎉 Dọn dẹp hoàn tất!" -ForegroundColor Green
