name: siêu bá ki của đạt lor kim (github native persistence)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng (tính từ lúc job bắt đầu)'
        required: false
        default: '5h40m'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h40m'
      auto_restart:
        description: '🔁 Tự khởi động phiên mới sau khi hết giờ'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ký tự ổ đĩa ảo riêng biệt để chứa toàn bộ Hệ Điều Hành & Dữ Liệu'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 Dung lượng ổ đĩa ảo VHDX tối đa (GB - co giãn động)'
        required: false
        default: '45'
        type: string
      windows_image:
        description: '🪟 Bản Windows (GIỮ CỐ ĐỊNH giữa các phiên để app không lỗi)'
        required: false
        default: 'windows-2022'
        type: choice
        options:
          - 'windows-2022'
          - 'windows-2025'
      rdp_user:
        description: '👤 User riêng gắn với ổ lưu trữ'
        required: false
        default: 'AISTV-D'
        type: string
      choco_packages:
        description: '📦 App cài thêm bằng choco (tự động lưu vết sang phiên sau)'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚙️ Tối ưu Windows (múi giờ VN, tắt sleep, tắt Update/Defender realtime, giữ phiên RDP)'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 Cập nhật DuckDNS trỏ về IP Tailscale (cần secret DUCKDNS_TOKEN + DUCKDNS_DOMAIN)'
        required: false
        default: true
        type: boolean
      enable_rustdesk:
        description: '🖥️ Cài RustDesk với ID cố định (cấu hình lưu thẳng vào ổ riêng)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-stv-premium-github-drive-rdp
  cancel-in-progress: false

jobs:
  Premium-RDP-Setup:
    runs-on: ${{ inputs.windows_image }}
    timeout-minutes: 355

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: 'aistv-persistent-os-storage'
      STATE_BRANCH: 'aistv-drive-state'
      DRIVE_LETTER: ${{ inputs.drive_letter }}
      VHD_SIZE_GB: ${{ inputs.vhd_size_gb }}

    steps:
      # ───────────────────────────────────────────────
      # 1. DỰNG Ổ ĐĨA RIÊNG NGAY LẬP TỨC & CHUẨN BỊ KHO GITHUB
      # ───────────────────────────────────────────────
      - name: 🧱 Dựng ổ đĩa riêng & Chuẩn bị thông số GitHub
        shell: pwsh
        env:
          INPUT_DURATION: ${{ inputs.duration }}
          INPUT_USER: ${{ inputs.rdp_user }}
        run: |
          "JOB_START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV

          switch ($env:INPUT_DURATION) {
              '1h'    { $total = 60;  $display = '1 giờ' }
              '3h'    { $total = 180; $display = '3 giờ' }
              default { $total = 340; $display = '5 giờ 40 phút' }
          }
          "TOTAL_MINUTES=$total" >> $env:GITHUB_ENV
          "DISPLAY_TIME=$display" >> $env:GITHUB_ENV

          $user = if ([string]::IsNullOrWhiteSpace($env:INPUT_USER)) { 'AISTV-D' } else { $env:INPUT_USER.Trim() }
          if ($user -notmatch '^[A-Za-z][A-Za-z0-9_-]{0,19}$') {
              Write-Host "❌ Tên user không hợp lệ (chỉ chữ/số/_/-, tối đa 20 ký tự, bắt đầu bằng chữ)" -ForegroundColor Red
              exit 1
          }
          "RDP_USER=$user" >> $env:GITHUB_ENV

          $dl = ($env:DRIVE_LETTER.Trim() -replace '[^A-Za-z]', '').ToUpper()
          if (-not $dl -or $dl -in @('C','D')) { $dl = 'X' }
          "MOUNT_LETTER=$dl" >> $env:GITHUB_ENV

          # Chọn nơi đặt VHDX vật lý trên ổ có dung lượng trống lớn nhất (ưu tiên D:, rồi C:)
          $hostDrive = 'D:\'
          if (-not (Test-Path 'D:\') -or ((Get-PSDrive D).Free -lt 30GB)) { $hostDrive = 'C:\' }
          $vhdContainer = [System.IO.Path]::Combine($hostDrive, 'AISTV-VHD-HOST')
          New-Item -ItemType Directory -Force -Path $vhdContainer | Out-Null
          $vhdFile = [System.IO.Path]::Combine($vhdContainer, 'aistv-os-disk.vhdx')

          # Khởi tạo và Mount ổ đĩa riêng ngay lập tức
          $sizeBytes = ([int64]$env:VHD_SIZE_GB) * 1GB
          Write-Host "💽 Đang dựng ổ đĩa riêng ${dl}:\ ($($env:VHD_SIZE_GB) GB Dynamic VHDX)..." -ForegroundColor Cyan
          $mounted = $false
          try {
              if (-not (Test-Path $vhdFile)) {
                  New-VHD -Path $vhdFile -SizeBytes $sizeBytes -Dynamic |
                      Mount-VHD -PassThru |
                      Initialize-Disk -PartitionStyle GPT -PassThru |
                      New-Partition -DriveLetter $dl -UseMaximumSize |
                      Format-Volume -FileSystem NTFS -NewFileSystemLabel 'AISTV-OS' -Confirm:$false | Out-Null
              } else {
                  Mount-VHD -Path $vhdFile
              }
              $null = Get-PSDrive -Name $dl -ErrorAction Stop
              if (Test-Path "${dl}:\") { $mounted = $true }
          } catch {
              Write-Host "⚠️ Chuyển sang cơ chế Ổ Đĩa Ảo Kernel DOS Devices cho ${dl}:\..." -ForegroundColor Yellow
          }

          if (-not $mounted) {
              $fallbackDir = [System.IO.Path]::Combine($vhdContainer, 'VIRTUAL-DRIVE-ROOT')
              New-Item -ItemType Directory -Force -Path $fallbackDir | Out-Null
              & subst "${dl}:" $fallbackDir
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force
              $null = New-PSDrive -Name $dl -PSProvider FileSystem -Root "${dl}:\" -Scope Global -ErrorAction SilentlyContinue
          }

          $sharedRoot       = "${dl}:\AISTV-SYSTEM"
          $sharedSessionDir = "$sharedRoot\sessions"
          $sharedDataDir    = "$sharedRoot\DATA"
          $sharedOsDir      = "$sharedRoot\OS-OVERLAY"
          $sharedStateFile  = "$sharedSessionDir\rdp-session-state.json"
          $profileRoot      = "$sharedRoot\Users"
          $profileBackup    = 'C:\aistv-profile-old'
          $baselineFile     = [System.IO.Path]::Combine($env:RUNNER_TEMP, 'baseline-c-dirs.json')

          foreach ($p in @($sharedRoot, $sharedSessionDir, $sharedDataDir, $sharedOsDir, $profileRoot, "${dl}:\Apps")) {
              New-Item -ItemType Directory -Force -Path $p | Out-Null
          }

          # Chụp danh sách thư mục gốc của ổ C: trước khi khôi phục để tự động phát hiện mọi phần mềm cài mới vào ổ C:
          $baseline = @{
              PF64 = @(Get-ChildItem 'C:\Program Files' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
              PF86 = @(Get-ChildItem 'C:\Program Files (x86)' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
              PD   = @(Get-ChildItem 'C:\ProgramData' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
          }
          $baseline | ConvertTo-Json -Depth 4 | Set-Content -Path $baselineFile -Encoding UTF8

          "VHD_CONTAINER=$vhdContainer" >> $env:GITHUB_ENV
          "VHD_FILE=$vhdFile" >> $env:GITHUB_ENV
          "SHARED_ROOT=$sharedRoot" >> $env:GITHUB_ENV
          "SHARED_SESSION_DIR=$sharedSessionDir" >> $env:GITHUB_ENV
          "SHARED_DATA_DIR=$sharedDataDir" >> $env:GITHUB_ENV
          "SHARED_OS_DIR=$sharedOsDir" >> $env:GITHUB_ENV
          "SHARED_STATE_FILE=$sharedStateFile" >> $env:GITHUB_ENV
          "PROFILE_ROOT=$profileRoot" >> $env:GITHUB_ENV
          "PROFILE_BACKUP=$profileBackup" >> $env:GITHUB_ENV
          "BASELINE_FILE=$baselineFile" >> $env:GITHUB_ENV

          $build = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuild
          "OS_BUILD=$build" >> $env:GITHUB_ENV

          # Đảm bảo Release trên GitHub tồn tại để chứa các chunk của ổ đĩa
          $null = gh release view $env:RELEASE_TAG --repo $env:GH_REPO 2>&1
          if ($LASTEXITCODE -ne 0) {
              Write-Host "ℹ️ Tạo kho lưu trữ Release [$($env:RELEASE_TAG)] trên GitHub..." -ForegroundColor Cyan
              $dummy = [System.IO.Path]::Combine($env:RUNNER_TEMP, 'init.txt')
              Set-Content -Path $dummy -Value "AI-STV Persistent Storage Initialized" -Encoding UTF8
              gh release create $env:RELEASE_TAG $dummy --repo $env:GH_REPO --title "AI-STV Persistent OS Drive" --notes "Kho lưu trữ ổ đĩa tự động giữa các phiên (Không xóa)"
          }
          $global:LASTEXITCODE = 0
          Write-Host "✅ Đã mount thành công ổ đĩa riêng: ${dl}:\ ($sharedRoot)" -ForegroundColor Green

      # ───────────────────────────────────────────────
      # 2. TẠO ENGINE ĐỒNG BỘ Ổ ĐĨA LÊN GITHUB (RELEASE CHUNKS + GIT BRANCH)
      # ───────────────────────────────────────────────
      - name: 🧰 Tạo script đóng gói & đẩy toàn bộ ổ đĩa lên GitHub
        shell: pwsh
        run: |
          $script = @'
          param(
              [string]$Reason = 'save'
          )
          $ErrorActionPreference = 'Continue'

          if ($env:DATA_RESTORED -ne '1') {
              Write-Host '⚠️ Dữ liệu chưa khôi phục xong, bỏ qua lưu để tránh ghi đè rỗng' -ForegroundColor Yellow
              exit 0
          }

          $root  = $env:SHARED_ROOT
          $osDir = $env:SHARED_OS_DIR
          $dl    = $env:MOUNT_LETTER
          if (-not $root -or -not (Test-Path $root)) {
              Write-Host 'ℹ️ Chưa thấy ổ đĩa chung, bỏ qua'
              exit 0
          }

          Write-Host "💾 [$Reason] Đang thu thập trạng thái Hệ Điều Hành, Registry, Services & App..." -ForegroundColor Cyan

          # 1. Xuất các nhánh Registry hệ thống & lưu ảnh chụp NTUSER.DAT sống bằng reg save
          $regBk = Join-Path $osDir 'Registry'
          New-Item -ItemType Directory -Force -Path $regBk | Out-Null
          reg export "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" "$regBk\Uninstall-x64.reg" /y *> $null
          reg export "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall" "$regBk\Uninstall-x86.reg" /y *> $null
          reg export "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" "$regBk\System-Env.reg" /y *> $null

          $u = $env:RDP_USER
          if ($u) {
              $userObj = Get-LocalUser -Name $u -ErrorAction SilentlyContinue
              if ($userObj) {
                  $sid = $userObj.SID.Value
                  if (Test-Path "Registry::HKU\$sid") {
                      reg export "HKU\$sid\Environment" "$regBk\User-Env.reg" /y *> $null
                      if ($env:PROFILE_PATH -and (Test-Path $env:PROFILE_PATH)) {
                          reg save "HKU\$sid" "$($env:PROFILE_PATH)\NTUSER.DAT.live" /y *> $null
                      }
                  }
              }
          }

          # 2. Gom tất cả thư mục phần mềm người dùng cài thêm vào C:\Program Files, Program Files (x86), ProgramData sang ổ riêng
          if ($env:BASELINE_FILE -and (Test-Path $env:BASELINE_FILE)) {
              try {
                  $base = Get-Content -Raw $env:BASELINE_FILE | ConvertFrom-Json
                  $skipNames = @('Tailscale', 'RustDesk', 'chocolatey', 'Package Cache', 'Microsoft', 'Windows Defender')

                  $cOverlay = Join-Path $osDir 'C-Drive-Overlay'
                  New-Item -ItemType Directory -Force -Path "$cOverlay\PF64", "$cOverlay\PF86", "$cOverlay\PD" | Out-Null

                  Get-ChildItem 'C:\Program Files' -Directory -Force -ErrorAction SilentlyContinue | Where-Object {
                      $_.Name -notin $base.PF64 -and $_.Name -notin $skipNames
                  } | ForEach-Object {
                      robocopy $_.FullName "$cOverlay\PF64\$($_.Name)" /MIR /B /XJ /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
                  }

                  Get-ChildItem 'C:\Program Files (x86)' -Directory -Force -ErrorAction SilentlyContinue | Where-Object {
                      $_.Name -notin $base.PF86 -and $_.Name -notin $skipNames
                  } | ForEach-Object {
                      robocopy $_.FullName "$cOverlay\PF86\$($_.Name)" /MIR /B /XJ /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
                  }

                  Get-ChildItem 'C:\ProgramData' -Directory -Force -ErrorAction SilentlyContinue | Where-Object {
                      $_.Name -notin $base.PD -and $_.Name -notin $skipNames
                  } | ForEach-Object {
                      robocopy $_.FullName "$cOverlay\PD\$($_.Name)" /MIR /B /XJ /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
                  }
              } catch {}
          }

          # 3. Đồng bộ mọi thư mục người dùng tạo thêm ở ngoài gốc ổ X:\ (ví dụ X:\Apps, X:\Games...) vào trong $osDir\DriveRoot-Extra
          try {
              $extraRoot = Join-Path $osDir 'DriveRoot-Extra'
              New-Item -ItemType Directory -Force -Path $extraRoot | Out-Null
              Get-ChildItem "${dl}:\" -Force -ErrorAction SilentlyContinue | Where-Object {
                  $_.Name -notin @('AISTV-SYSTEM', 'System Volume Information', '$RECYCLE.BIN', 'Pagefile.sys')
              } | ForEach-Object {
                  if ($_.PSIsContainer) {
                      robocopy $_.FullName "$extraRoot\$($_.Name)" /MIR /B /XJ /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
                  } else {
                      Copy-Item $_.FullName "$extraRoot\$($_.Name)" -Force -ErrorAction SilentlyContinue
                  }
              }
          } catch {}

          # 4. Đồng bộ cấu hình RustDesk (service) vào ổ chung để được backup cùng
          try {
              $rdCfg = 'C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config'
              if (Test-Path (Join-Path $rdCfg 'RustDesk.toml')) {
                  $rdBk = Join-Path $env:SHARED_SESSION_DIR 'rustdesk-config'
                  New-Item -ItemType Directory -Force -Path $rdBk | Out-Null
                  robocopy $rdCfg $rdBk /MIR /B /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
              }
          } catch {
              Write-Host "⚠️ Lỗi đồng bộ RustDesk: $($_.Exception.Message)" -ForegroundColor Yellow
          }
          $global:LASTEXITCODE = 0

          # 5. Cập nhật file state JSON
          $stateFile = $env:SHARED_STATE_FILE
          if ($stateFile -and (Test-Path $stateFile)) {
              try {
                  $st = Get-Content -Raw $stateFile | ConvertFrom-Json
                  $st.lastUpdatedUtc = (Get-Date).ToUniversalTime().ToString('o')
                  $st.lastSaveReason = $Reason
                  $st | ConvertTo-Json -Depth 5 | Set-Content -Path $stateFile -Encoding UTF8
              } catch {}
          }

          # 6. Đẩy state & metadata trực tiếp vào nhánh Git (aistv-drive-state) trên repo
          $gitStage = [System.IO.Path]::Combine($env:RUNNER_TEMP, 'git-state-sync')
          try {
              if (Test-Path $gitStage) { Remove-Item $gitStage -Recurse -Force -ErrorAction SilentlyContinue }
              New-Item -ItemType Directory -Force -Path $gitStage | Out-Null
              Push-Location $gitStage
              git init -q
              git config user.name "AI-STV-Bot"
              git config user.email "bot@aistv.local"
              git remote add origin "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:GH_REPO).git"
              git fetch origin $env:STATE_BRANCH -q 2>$null
              if ($LASTEXITCODE -eq 0) {
                  git checkout -B $env:STATE_BRANCH "origin/$($env:STATE_BRANCH)" -q
              } else {
                  git checkout --orphan $env:STATE_BRANCH -q
              }
              robocopy $env:SHARED_SESSION_DIR "$gitStage\sessions" /MIR /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
              robocopy $regBk "$gitStage\registry" /MIR /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
              $global:LASTEXITCODE = 0
              git add -A
              git commit -m "Sync session state [$Reason] at $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" -q 2>$null
              git push -u origin $env:STATE_BRANCH --force -q 2>$null
              Pop-Location
              Write-Host "✅ [$Reason] Đã lưu state & registry lên nhánh Git ($($env:STATE_BRANCH))" -ForegroundColor Green
          } catch {
              if ((Get-Location).Path -eq $gitStage) { Pop-Location }
          }

          # 7. Đóng gói toàn bộ ổ đĩa riêng thành các phân mảnh 1900MB và đẩy thẳng lên GitHub Release
          $packDir = [System.IO.Path]::Combine($env:RUNNER_TEMP, "gh-pack-$Reason")
          if (Test-Path $packDir) { Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $packDir | Out-Null

          $archiveBase = Join-Path $packDir 'aistv-drive.7z'
          Write-Host "📦 [$Reason] Đang nén toàn bộ ổ đĩa $root (đa luồng, đọc cả file đang mở)..." -ForegroundColor Cyan

          Push-Location $root
          $7zArgs = @(
              'a', '-t7z', '-mx=1', '-mmt=on', '-ssw', '-v1900m',
              $archiveBase, '*',
              '-xr!Pagefile.sys', '-xr!swapfile.sys', '-xr!System Volume Information'
          )
          & 7z @7zArgs *> $null
          $7zCode = $LASTEXITCODE
          Pop-Location

          $chunks = @(Get-ChildItem -Path $packDir -Filter 'aistv-drive.7z.*' | Sort-Object Name)
          if ($chunks.Count -eq 0) {
              Write-Host "❌ [$Reason] Không tạo được gói nén ổ đĩa (mã 7z: $7zCode)" -ForegroundColor Red
              exit 1
          }

          $manifest = [ordered]@{
              updatedUtc = (Get-Date).ToUniversalTime().ToString('o')
              reason     = $Reason
              osBuild    = $env:OS_BUILD
              chunkCount = $chunks.Count
              chunks     = @($chunks | ForEach-Object {
                  [ordered]@{
                      name = $_.Name
                      size = $_.Length
                  }
              })
          }
          $manifestPath = Join-Path $packDir 'drive-manifest.json'
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path $manifestPath -Encoding UTF8

          Write-Host "⬆️  [$Reason] Đang tải $($chunks.Count) mảnh ổ đĩa lên GitHub Release ($($env:RELEASE_TAG))..." -ForegroundColor Cyan
          $uploadFiles = @($chunks | ForEach-Object { $_.FullName }) + @($manifestPath)
          gh release upload $env:RELEASE_TAG @uploadFiles --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ [$Reason] Upload lên GitHub Release thất bại" -ForegroundColor Red
              Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue
              exit 1
          }

          try {
              $relJson = gh release view $env:RELEASE_TAG --repo $env:GH_REPO --json assets | ConvertFrom-Json
              $validNames = @($chunks.Name) + @('drive-manifest.json', 'init.txt')
              foreach ($asset in $relJson.assets) {
                  if ($asset.name -like 'aistv-drive.7z.*' -and ($asset.name -notin $validNames)) {
                      gh release delete-asset $env:RELEASE_TAG $asset.name --repo $env:GH_REPO -y *> $null
                  }
              }
          } catch {}

          Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "✅ [$Reason] Đã lưu trọn vẹn toàn bộ ổ đĩa lên GitHub!" -ForegroundColor Green
          exit 0
          '@
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'save-data.ps1') -Value $script -Encoding UTF8
          Write-Host '✅ Đã tạo save-data.ps1 (GitHub Native Storage Engine)' -ForegroundColor Green

      # ───────────────────────────────────────────────
      # 3. KHÔI PHỤC TOÀN BỘ Ổ ĐĨA TỪ GITHUB RELEASE
      # ───────────────────────────────────────────────
      - name: ♻️ Khôi phục toàn bộ ổ đĩa từ GitHub
        shell: pwsh
        run: |
          $dl = $env:MOUNT_LETTER
          $dlDir = [System.IO.Path]::Combine($env:RUNNER_TEMP, 'gh-restore')
          if (Test-Path $dlDir) { Remove-Item $dlDir -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $dlDir | Out-Null

          gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern 'drive-manifest.json' --dir $dlDir 2>$null
          $manifestFile = Join-Path $dlDir 'drive-manifest.json'

          if (-not (Test-Path $manifestFile)) {
              Write-Host "ℹ️ Chưa có bản lưu ổ đĩa trên GitHub - đây là phiên khởi tạo đầu tiên!" -ForegroundColor Cyan
              'DATA_RESTORED=1' >> $env:GITHUB_ENV
              exit 0
          }

          $manifest = Get-Content -Raw $manifestFile | ConvertFrom-Json
          Write-Host "⬇️  Phát hiện ổ đĩa từ phiên trước ($($manifest.chunkCount) mảnh, cập nhật lúc $($manifest.updatedUtc)). Đang tải về..." -ForegroundColor Cyan

          gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern 'aistv-drive.7z.*' --dir $dlDir
          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ Lỗi tải các mảnh ổ đĩa từ GitHub Release. Dừng phiên để bảo vệ dữ liệu gốc!" -ForegroundColor Red
              exit 1
          }

          $firstChunk = Join-Path $dlDir 'aistv-drive.7z.001'
          if (-not (Test-Path $firstChunk)) {
              Write-Host "❌ Thiếu mảnh ghép đầu tiên (aistv-drive.7z.001)!" -ForegroundColor Red
              exit 1
          }

          $stage = Join-Path $env:VHD_CONTAINER 'restore-stage'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Write-Host "📂 Đang bung toàn bộ ổ đĩa vào ${dl}:\..." -ForegroundColor Cyan
          & 7z x "$firstChunk" "-o$stage" -y -mmt=on *> $null
          Remove-Item $dlDir -Recurse -Force -ErrorAction SilentlyContinue

          # Tìm đúng gốc chứa thư mục sessions
          $stateHit = Get-ChildItem $stage -Recurse -Depth 6 -Filter 'rdp-session-state.json' -File -Force -ErrorAction SilentlyContinue | Select-Object -First 1
          $sourceRoot = if ($stateHit) { $stateHit.Directory.Parent.FullName } else { $stage }

          # Chuyển toàn bộ dữ liệu (trừ thư mục Users đang chờ nạp profile) vào ổ riêng
          robocopy $sourceRoot $env:SHARED_ROOT /E /B /XJ /XD (Join-Path $sourceRoot 'Users') /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
          $global:LASTEXITCODE = 0
          New-Item -ItemType Directory -Force -Path $env:SHARED_DATA_DIR | Out-Null

          # Khôi phục các thư mục ngoài gốc ổ X:\ (nếu có)
          $extraRoot = Join-Path $env:SHARED_OS_DIR 'DriveRoot-Extra'
          if (Test-Path $extraRoot) {
              robocopy $extraRoot "${dl}:\" /E /B /XJ /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
              $global:LASTEXITCODE = 0
          }

          # Khôi phục các phần mềm đã cài vào C:\Program Files, Program Files (x86), ProgramData
          $cOverlay = Join-Path $env:SHARED_OS_DIR 'C-Drive-Overlay'
          if (Test-Path "$cOverlay\PF64") {
              robocopy "$cOverlay\PF64" 'C:\Program Files' /E /B /XJ /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
          }
          if (Test-Path "$cOverlay\PF86") {
              robocopy "$cOverlay\PF86" 'C:\Program Files (x86)' /E /B /XJ /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
          }
          if (Test-Path "$cOverlay\PD") {
              robocopy "$cOverlay\PD" 'C:\ProgramData' /E /B /XJ /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
          }
          $global:LASTEXITCODE = 0

          # Giữ riêng Profile cũ để bước tạo User nạp chuẩn SID + NTUSER.DAT
          $oldProf = Join-Path $sourceRoot "Users\$($env:RDP_USER)"
          if (Test-Path $oldProf) {
              if (Test-Path $env:PROFILE_BACKUP) { Remove-Item $env:PROFILE_BACKUP -Recurse -Force -ErrorAction SilentlyContinue }
              robocopy $oldProf $env:PROFILE_BACKUP /E /B /XJ /COPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
              $global:LASTEXITCODE = 0
              if (-not (Test-Path "$($env:PROFILE_BACKUP)\NTUSER.DAT") -and (Test-Path "$($env:PROFILE_BACKUP)\NTUSER.DAT.live")) {
                  Copy-Item "$($env:PROFILE_BACKUP)\NTUSER.DAT.live" "$($env:PROFILE_BACKUP)\NTUSER.DAT" -Force
              }
              Write-Host "✅ Đã lấy lại profile cũ (đầy đủ, gồm registry NTUSER.DAT)" -ForegroundColor Green
          } else {
              Write-Host "ℹ️ Không thấy profile của user $($env:RDP_USER) trong bản lưu" -ForegroundColor Yellow
          }
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue

          # Nạp lại các khóa Registry hệ thống, biến môi trường và danh sách phần mềm từ ổ riêng
          $regBk = Join-Path $env:SHARED_OS_DIR 'Registry'
          if (Test-Path $regBk) {
              Get-ChildItem $regBk -Filter '*.reg' | Where-Object { $_.Name -notlike 'User-*' } | ForEach-Object {
                  reg import $_.FullName *> $null
              }
              Write-Host "✅ Đã nạp lại Registry hệ thống & biến môi trường từ ổ riêng" -ForegroundColor Green
          }

          if (Test-Path $env:SHARED_STATE_FILE) {
              try {
                  $state = Get-Content -Raw $env:SHARED_STATE_FILE | ConvertFrom-Json
                  if ($state.password) {
                      "RESTORE_PASS=$($state.password)" >> $env:GITHUB_ENV
                      Write-Host "✅ Đã khôi phục mật khẩu phiên trước" -ForegroundColor Green
                  }
                  if ($state.sid) { "RESTORE_SID=$($state.sid)" >> $env:GITHUB_ENV }
                  if ($state.osBuild -and "$($state.osBuild)" -ne "$($env:OS_BUILD)") {
                      Write-Host "⚠️ Bản Windows khác phiên trước (trước: $($state.osBuild), nay: $($env:OS_BUILD)). Hãy chọn đúng windows_image." -ForegroundColor Yellow
                  }
              } catch {
                  Write-Host "⚠️ File state cũ không đọc được, bỏ qua" -ForegroundColor Yellow
              }
          }

          'DATA_RESTORED=1' >> $env:GITHUB_ENV
          Write-Host "✅ Khôi phục toàn bộ ổ đĩa từ GitHub hoàn tất!" -ForegroundColor Green
          exit 0

      # ───────────────────────────────────────────────
      # 4. ÁNH XẠ HỆ ĐIỀU HÀNH SANG Ổ RIÊNG & BANNER
      # ───────────────────────────────────────────────
      - name: 🔗 Gắn kết thư mục Hệ Điều Hành & Phần Mềm sang ổ riêng
        shell: pwsh
        run: |
          $osDir      = $env:SHARED_OS_DIR
          $appsDir    = Join-Path $osDir 'InstalledApps'
          $binDir     = Join-Path $osDir 'bin'
          $chocoCache = Join-Path $osDir 'choco-cache'
          $dl         = $env:MOUNT_LETTER

          foreach ($d in @($appsDir, $binDir, $chocoCache, "${dl}:\Apps")) {
              New-Item -ItemType Directory -Force -Path $d | Out-Null
          }

          if (-not (Test-Path 'C:\AISTV-Apps')) {
              New-Item -ItemType Junction -Path 'C:\AISTV-Apps' -Target $appsDir -Force | Out-Null
          }

          $sysEnv = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          $curPath = (Get-ItemProperty -Path $sysEnv -Name 'Path').Path
          if ($curPath -notlike "*$binDir*") {
              Set-ItemProperty -Path $sysEnv -Name 'Path' -Value "$binDir;$curPath" -Force
          }

          Write-Host ""
          Write-Host "🤖 AI STV PREMIUM RDP SERVER (GITHUB NATIVE DRIVE)" -ForegroundColor Yellow
          Write-Host "🗂️ Ổ đĩa riêng: ${dl}:\ ($env:SHARED_ROOT)" -ForegroundColor Cyan
          Write-Host "👤 User riêng: $env:RDP_USER" -ForegroundColor Cyan
          Write-Host "🕒 Thời gian: $env:DISPLAY_TIME" -ForegroundColor Magenta
          Write-Host "✅ Đã gắn kết C:\AISTV-Apps, ${dl}:\Apps & đồng bộ tự động C:\Program Files <-> ${dl}:\" -ForegroundColor Green

      # ───────────────────────────────────────────────
      # 5. CẤU HÌNH RDP & TỐI ƯU WINDOWS (THEO BẢN CŨ)
      # ───────────────────────────────────────────────
      - name: 🔧 CẤU HÌNH HỆ THỐNG
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "🛠️  ĐANG CẤU HỆ THỐNG RDP" -ForegroundColor Yellow

          $steps = @(
              @{Name="Bật Remote Desktop"; Script={
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
              }},
              @{Name="Cấu hình bảo mật RDP"; Script={
                  $p = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
                  Set-ItemProperty -Path $p -Name 'UserAuthentication' -Value 0 -Force
                  Set-ItemProperty -Path $p -Name 'SecurityLayer' -Value 0 -Force
              }},
              @{Name="Mở port 3389 (chỉ cho dải Tailscale)"; Script={
                  Remove-NetFirewallRule -DisplayName 'RDP-Premium' -ErrorAction SilentlyContinue
                  New-NetFirewallRule -DisplayName 'RDP-Premium' -Direction Inbound -Action Allow `
                      -Protocol TCP -LocalPort 3389 -RemoteAddress '100.64.0.0/10' -Profile Any | Out-Null
              }},
              @{Name="Khởi động dịch vụ"; Script={
                  Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue
                  Set-Service -Name UmRdpService -StartupType Automatic -ErrorAction SilentlyContinue
                  Start-Service -Name TermService -ErrorAction SilentlyContinue
                  Start-Service -Name UmRdpService -ErrorAction SilentlyContinue
              }}
          )

          foreach ($step in $steps) {
              try {
                  & $step.Script
                  Write-Host "│ ✅ $($step.Name)" -ForegroundColor Green
              } catch {
                  Write-Host "│ ⚠️  $($step.Name) - bỏ qua lỗi nhỏ: $($_.Exception.Message)" -ForegroundColor Yellow
              }
          }
          Write-Host "🎯 Cấu hình hoàn tất!" -ForegroundColor Green
          exit 0

      - name: ⚙️ TỐI ƯU WINDOWS
        if: ${{ inputs.optimize_windows }}
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "⚙️  ĐANG TỐI ƯU WINDOWS" -ForegroundColor Yellow

          $tweaks = @(
              @{Name="Múi giờ Việt Nam (UTC+7)"; Script={ tzutil /s 'SE Asia Standard Time' }},
              @{Name="Tắt sleep / tắt màn hình / hibernate"; Script={
                  powercfg /change standby-timeout-ac 0
                  powercfg /change monitor-timeout-ac 0
                  powercfg /change disk-timeout-ac 0
                  powercfg /hibernate off
              }},
              @{Name="Giữ phiên RDP (không tự ngắt khi rảnh/ngắt kết nối)"; Script={
                  $p = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
                  New-Item -Path $p -Force | Out-Null
                  Set-ItemProperty -Path $p -Name 'MaxIdleTime' -Value 0 -Type DWord -Force
                  Set-ItemProperty -Path $p -Name 'MaxDisconnectionTime' -Value 0 -Type DWord -Force
                  Set-ItemProperty -Path $p -Name 'fResetBroken' -Value 0 -Type DWord -Force
              }},
              @{Name="Tắt Windows Update (tránh tự cập nhật làm đổi bản Windows)"; Script={
                  Stop-Service -Name wuauserv -Force -ErrorAction SilentlyContinue
                  Set-Service -Name wuauserv -StartupType Disabled -ErrorAction SilentlyContinue
                  Stop-Service -Name UsoSvc -Force -ErrorAction SilentlyContinue
                  Set-Service -Name UsoSvc -StartupType Disabled -ErrorAction SilentlyContinue
              }},
              @{Name="Tắt Defender realtime (cho app chạy nhẹ, ít bị chặn)"; Script={
                  Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
              }}
          )

          foreach ($t in $tweaks) {
              try {
                  & $t.Script
                  Write-Host "│ ✅ $($t.Name)" -ForegroundColor Green
              } catch {
                  Write-Host "│ ⚠️  $($t.Name) - bỏ qua: $($_.Exception.Message)" -ForegroundColor Yellow
              }
          }
          exit 0

      - name: 📦 CÀI APP (Tự động lưu danh sách gói vào ổ riêng cho các phiên sau)
        shell: pwsh
        env:
          PKGS: ${{ inputs.choco_packages }}
        run: |
          $pkgListFile = Join-Path $env:SHARED_OS_DIR 'installed-choco-packages.txt'
          $savedPkgs = @()
          if (Test-Path $pkgListFile) {
              $savedPkgs = @(Get-Content $pkgListFile | Where-Object { $_ -match '^[A-Za-z0-9._\-]+$' })
          }
          $inputPkgs = @()
          if (-not [string]::IsNullOrWhiteSpace($env:PKGS)) {
              if ($env:PKGS -notmatch '^[A-Za-z0-9 ._\-]*$') {
                  Write-Host "❌ Danh sách app chứa ký tự không hợp lệ" -ForegroundColor Red
                  exit 1
              }
              $inputPkgs = @($env:PKGS -split '\s+' | Where-Object { $_ })
          }
          $allPkgs = @($savedPkgs + $inputPkgs | Select-Object -Unique)
          if ($allPkgs.Count -gt 0) {
              $allPkgs | Set-Content -Path $pkgListFile -Encoding UTF8
              $chocoCache = Join-Path $env:SHARED_OS_DIR 'choco-cache'
              foreach ($p in $allPkgs) {
                  Write-Host "📦 Cài $p (cache trên ổ riêng)..." -ForegroundColor Cyan
                  choco install $p -y --no-progress --limit-output --cache-location="$chocoCache"
                  if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
                      Write-Host "│ ⚠️  Cài $p lỗi (mã $LASTEXITCODE), bỏ qua" -ForegroundColor Yellow
                  }
                  $global:LASTEXITCODE = 0
              }
          }
          exit 0

      # ───────────────────────────────────────────────
      # 6. TẠO TÀI KHOẢN RIÊNG + PROFILE TRÊN Ổ RIÊNG
      # ───────────────────────────────────────────────
      - name: 👤 TẠO USER RIÊNG (PROFILE TRÊN Ổ RIÊNG)
        shell: pwsh
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.RDP_PASSWORD }}
        run: |
          Write-Host ""
          Write-Host "👤 ĐANG TẠO USER RIÊNG: $env:RDP_USER" -ForegroundColor Yellow
          $user = $env:RDP_USER

          function Get-Pick([string]$s) {
              $s[[System.Security.Cryptography.RandomNumberGenerator]::GetInt32($s.Length)]
          }

          function New-PremiumPassword {
              $upper   = 'ABCDEFGHJKLMNPQRSTUVWXYZ'
              $lower   = 'abcdefghijkmnpqrstuvwxyz'
              $numbers = '23456789'
              $all     = $upper + $lower + $numbers
              $chars = @((Get-Pick $upper), (Get-Pick $lower), (Get-Pick $numbers))
              for ($i = 1; $i -le 9; $i++) { $chars += (Get-Pick $all) }
              -join ($chars | Sort-Object { [System.Security.Cryptography.RandomNumberGenerator]::GetInt32([int]::MaxValue) })
          }

          if ($env:RDP_PASSWORD_SECRET) {
              $matKhau = $env:RDP_PASSWORD_SECRET; $source = 'secret'
              Write-Host "│ ℹ️  Dùng mật khẩu từ secret RDP_PASSWORD" -ForegroundColor Blue
          } elseif ($env:RESTORE_PASS) {
              $matKhau = $env:RESTORE_PASS; $source = 'restored'
              Write-Host "│ ℹ️  Dùng mật khẩu đã lưu từ phiên trước" -ForegroundColor Blue
          } else {
              $matKhau = New-PremiumPassword; $source = 'generated'
              Write-Host "│ ℹ️  Tạo mật khẩu mới" -ForegroundColor Blue
          }

          $securePass = ConvertTo-SecureString $matKhau -AsPlainText -Force

          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name $user -ErrorAction SilentlyContinue
              Write-Host "│ ✅ Đã xóa user cũ" -ForegroundColor Green
          }

          try {
              New-LocalUser -Name $user -Password $securePass -AccountNeverExpires -PasswordNeverExpires -Description 'AI STV Persistent User' | Out-Null
              Add-LocalGroupMember -Group 'Administrators' -Member $user -ErrorAction SilentlyContinue
              Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $user -ErrorAction SilentlyContinue
              Enable-LocalUser -Name $user
              Write-Host "│ ✅ Đã tạo user & cấp quyền Administrator + RDP" -ForegroundColor Green
          } catch {
              Write-Host "│ ❌ Lỗi tạo user: $($_.Exception.Message)" -ForegroundColor Red
              exit 1
          }

          "RDP_PASS=$matKhau" >> $env:GITHUB_ENV
          "RDP_PASS_SOURCE=$source" >> $env:GITHUB_ENV

          $root = $env:PROFILE_ROOT
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $pl = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList'
          Set-ItemProperty -Path $pl -Name 'ProfilesDirectory' -Value $root -Type ExpandString -Force

          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class AistvProfile {
              [DllImport("userenv.dll", CharSet = CharSet.Unicode)]
              public static extern int CreateProfile(string pszUserSid, string pszUserName, StringBuilder pszProfilePath, uint cchProfilePath);
          }
          '@

          $sid = (Get-LocalUser -Name $user).SID.Value
          $sb  = New-Object System.Text.StringBuilder 260
          $hr  = [AistvProfile]::CreateProfile($sid, $user, $sb, 260)
          $profPath = $sb.ToString()
          if ($hr -ne 0) {
              Write-Host ("│ ⚠️  CreateProfile trả mã 0x{0:X8} (profile sẽ được tạo khi đăng nhập lần đầu, vẫn nằm trên ổ riêng)" -f $hr) -ForegroundColor Yellow
          }
          if ([string]::IsNullOrWhiteSpace($profPath) -or -not (Test-Path $profPath)) {
              $profPath = Join-Path $root $user
              New-Item -ItemType Directory -Force -Path $profPath | Out-Null
          }
          Write-Host "│ ✅ Profile: $profPath" -ForegroundColor Green
          "PROFILE_PATH=$profPath" >> $env:GITHUB_ENV

          if ((Test-Path $env:PROFILE_BACKUP) -and (Test-Path $profPath)) {
              robocopy $env:PROFILE_BACKUP $profPath /E /B /XJ /COPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
              $global:LASTEXITCODE = 0
              Remove-Item $env:PROFILE_BACKUP -Recurse -Force -ErrorAction SilentlyContinue
              & icacls $profPath /setowner "$user" /T /C /Q *> $null
              & icacls $profPath /grant "${user}:(OI)(CI)F" /T /C /Q *> $null
              Write-Host "│ ✅ Đã khôi phục toàn bộ profile (file + registry NTUSER.DAT)" -ForegroundColor Green

              if ($env:RESTORE_SID -and $env:RESTORE_SID -ne $sid) {
                  Write-Host "│ ⚠️  SID user đổi (cũ: $($env:RESTORE_SID) -> mới: $sid). Khóa DPAPI cũ sẽ không giải mã được: Discord/Chrome/Edge có thể đòi đăng nhập lại." -ForegroundColor Yellow
              } elseif ($env:RESTORE_SID) {
                  Write-Host "│ ✅ SID user giống phiên trước (DPAPI giải mã được token đăng nhập)" -ForegroundColor Green
              }
          } else {
              Write-Host "│ ℹ️  Chưa có dữ liệu profile cũ (phiên đầu tiên)" -ForegroundColor Cyan
          }

          try {
              $ws  = New-Object -ComObject WScript.Shell
              $lnk1 = $ws.CreateShortcut('C:\Users\Public\Desktop\O-DIA-RIENG-AISTV.lnk')
              $lnk1.TargetPath = "$($env:MOUNT_LETTER):\"
              $lnk1.Save()

              $lnk2 = $ws.CreateShortcut('C:\Users\Public\Desktop\AISTV-SHARED.lnk')
              $lnk2.TargetPath = $env:SHARED_DATA_DIR
              $lnk2.Save()
              Write-Host "│ ✅ Đã tạo shortcut ổ đĩa riêng & AISTV-SHARED trên Desktop" -ForegroundColor Green
          } catch {
              Write-Host "│ ⚠️  Không tạo được shortcut" -ForegroundColor Yellow
          }

          Write-Host "✅ User $user đã sẵn sàng" -ForegroundColor Green
          exit 0

      - name: 🔍 KIỂM TRA QUYỀN HỆ THỐNG
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "🔍 KIỂM TRA QUYỀN ĐĂNG NHẬP" -ForegroundColor Yellow
          $u = $env:RDP_USER

          $user = Get-LocalUser -Name $u -ErrorAction SilentlyContinue
          if (-not $user) { Write-Host "│ ❌ User không tồn tại" -ForegroundColor Red; exit 1 }
          Write-Host "│ ✅ User tồn tại (Enabled: $($user.Enabled))" -ForegroundColor Green

          $isAdmin = (Get-LocalGroupMember -Group 'Administrators' | Where-Object { $_.Name -like "*\$u" }).Count -gt 0
          $isRdp   = (Get-LocalGroupMember -Group 'Remote Desktop Users' | Where-Object { $_.Name -like "*\$u" }).Count -gt 0
          Write-Host "│ $(if ($isAdmin) {'✅'} else {'❌'}) Quyền Administrator"
          Write-Host "│ $(if ($isRdp) {'✅'} else {'❌'}) Quyền Remote Desktop"
          Write-Host "│ $(if (Test-Path $env:PROFILE_PATH) {'✅'} else {'⚠️'}) Profile trên ổ riêng: $env:PROFILE_PATH"

          $svc = Get-Service -Name TermService -ErrorAction SilentlyContinue
          Write-Host "│ $(if ($svc.Status -eq 'Running') {'✅'} else {'❌'}) TermService: $($svc.Status)"
          exit 0

      # ───────────────────────────────────────────────
      # 7. TAILSCALE (DÙNG BẢN CŨ ỔN ĐỊNH 100%)
      # ───────────────────────────────────────────────
      - name: 🌐 THIẾT LẬP MẠNG PREMIUM
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "🌐 ĐANG THIẾT LẬP KẾT NỐI MẠNG" -ForegroundColor Yellow

          if (-not $env:TAILSCALE_AUTH_KEY) {
              Write-Host "❌ Thiếu secret TAILSCALE_AUTH_KEY" -ForegroundColor Red
              exit 1
          }

          $msiPath = "$env:TEMP\tailscale-premium.msi"
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $msiPath
          Start-Process msiexec.exe -ArgumentList '/i', "`"$msiPath`"", '/quiet', '/norestart' -Wait
          Remove-Item $msiPath -Force -ErrorAction SilentlyContinue
          Write-Host "│ ✅ Đã cài Tailscale" -ForegroundColor Green

          Start-Sleep -Seconds 10
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up "--authkey=$($env:TAILSCALE_AUTH_KEY)" "--hostname=ai-stv-premium-$($env:GITHUB_RUN_ID)" --accept-routes --accept-dns --reset
          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ Lỗi kết nối Tailscale" -ForegroundColor Red
              exit 1
          }
          Write-Host "│ ✅ Kết nối Tailscale thành công" -ForegroundColor Green

          $ip = $null
          for ($i = 0; $i -lt 20; $i++) {
              $out = (& $ts ip -4 2>&1 | Out-String).Trim()
              if ($out -match '^\d+\.\d+\.\d+\.\d+$') { $ip = $out; break }
              Start-Sleep -Seconds 3
          }

          if (-not $ip) {
              Write-Host "❌ Không lấy được IP Tailscale" -ForegroundColor Red
              exit 1
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "✅ Địa chỉ IP: $ip" -ForegroundColor Green
          exit 0

      # ───────────────────────────────────────────────
      # 8. DUCKDNS & RUSTDESK (DÙNG BẢN CŨ ỔN ĐỊNH 100%)
      # ───────────────────────────────────────────────
      - name: 🦆 CẬP NHẬT DUCKDNS
        if: ${{ inputs.enable_duckdns }}
        shell: pwsh
        env:
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
        run: |
          Write-Host ""
          Write-Host "🦆 ĐANG CẬP NHẬT DUCKDNS" -ForegroundColor Yellow

          if (-not $env:DUCKDNS_TOKEN -or -not $env:DUCKDNS_DOMAIN) {
              Write-Host "⚠️ Thiếu secret DUCKDNS_TOKEN hoặc DUCKDNS_DOMAIN, bỏ qua DuckDNS" -ForegroundColor Yellow
              exit 0
          }
          if (-not $env:TAILSCALE_IP) {
              Write-Host "⚠️ Chưa có IP Tailscale, bỏ qua DuckDNS" -ForegroundColor Yellow
              exit 0
          }

          $domain = ($env:DUCKDNS_DOMAIN.Trim().ToLower()) -replace '\.duckdns\.org$', ''
          if ($domain -notmatch '^[a-z0-9-]+$') {
              Write-Host "⚠️ DUCKDNS_DOMAIN không hợp lệ (chỉ nhập 1 tên, vd: myrdp)" -ForegroundColor Yellow
              exit 0
          }

          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
              try {
                  $res = Invoke-RestMethod -Uri "https://www.duckdns.org/update?domains=$domain&token=$($env:DUCKDNS_TOKEN)&ip=$($env:TAILSCALE_IP)" -TimeoutSec 20
                  if ("$res".Trim() -eq 'OK') { $ok = $true; break }
              } catch {}
              Start-Sleep -Seconds 5
          }

          if ($ok) {
              "DUCKDNS_HOST=${domain}.duckdns.org" >> $env:GITHUB_ENV
              Write-Host "✅ ${domain}.duckdns.org -> $env:TAILSCALE_IP" -ForegroundColor Green
          } else {
              Write-Host "⚠️ DuckDNS trả KO hoặc lỗi mạng (kiểm tra lại token / tên miền)" -ForegroundColor Yellow
          }
          exit 0

      - name: 🖥️ CÀI RUSTDESK (ID CỐ ĐỊNH)
        if: ${{ inputs.enable_rustdesk }}
        timeout-minutes: 8
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUSTDESK_PASSWORD_SECRET: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          Write-Host ""
          Write-Host "🖥️  ĐANG CÀI RUSTDESK" -ForegroundColor Yellow

          $svcCfg    = 'C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config'
          $bkCfg     = Join-Path $env:SHARED_SESSION_DIR 'rustdesk-config'
          $guidFile  = Join-Path $env:SHARED_SESSION_DIR 'rustdesk-machine-guid.txt'
          $idFile    = Join-Path $env:SHARED_SESSION_DIR 'rustdesk-id.txt'
          $rd        = "$env:ProgramFiles\RustDesk\rustdesk.exe"
          $installer = Join-Path $env:RUNNER_TEMP 'rustdesk-setup.exe'

          try {
              $cryptoKey = 'HKLM:\SOFTWARE\Microsoft\Cryptography'
              $savedGuid = $null
              if (Test-Path $guidFile) {
                  $g = (Get-Content -Raw $guidFile).Trim()
                  if ($g -match '^[0-9a-fA-F-]{36}$') { $savedGuid = $g }
              }
              if ($savedGuid) {
                  Set-ItemProperty -Path $cryptoKey -Name 'MachineGuid' -Value $savedGuid -Force
                  Write-Host "│ ✅ Đã dùng lại MachineGuid của phiên trước" -ForegroundColor Green
              } else {
                  $cur = (Get-ItemProperty -Path $cryptoKey).MachineGuid
                  Set-Content -Path $guidFile -Value $cur -Encoding ASCII
                  Write-Host "│ ℹ️  Lưu MachineGuid hiện tại để dùng cho các phiên sau" -ForegroundColor Cyan
              }

              $url = 'https://github.com/rustdesk/rustdesk/releases/download/1.3.9/rustdesk-1.3.9-x86_64.exe'
              try {
                  $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/rustdesk/rustdesk/releases/latest' `
                      -Headers @{ 'User-Agent' = 'aistv-rdp'; 'Authorization' = "Bearer $($env:GH_TOKEN)" } -TimeoutSec 30
                  $asset = $rel.assets | Where-Object { $_.name -match '^rustdesk-[0-9.]+-x86_64\.exe$' } | Select-Object -First 1
                  if ($asset) { $url = $asset.browser_download_url }
              } catch {
                  Write-Host "│ ⚠️  Không hỏi được bản mới nhất, dùng bản dự phòng 1.3.9" -ForegroundColor Yellow
              }
              Write-Host "│ ⬇️  $url" -ForegroundColor Cyan
              $ProgressPreference = 'SilentlyContinue'
              Invoke-WebRequest -Uri $url -OutFile $installer
              Write-Host "│ ✅ Đã tải xong bộ cài" -ForegroundColor Green
              if (-not (Test-Path $installer)) { throw 'Không tải được bộ cài RustDesk' }

              $inst = Start-Process -FilePath $installer -ArgumentList '--silent-install' -PassThru
              [void]$inst.WaitForExit(60000)
              $svc = $null
              for ($i = 0; $i -lt 30 -and -not $svc; $i++) {
                  $svc = Get-Service -Name 'RustDesk' -ErrorAction SilentlyContinue
                  if (-not $svc) { Start-Sleep -Seconds 2 }
              }
              if (-not $svc -or -not (Test-Path $rd)) { throw 'RustDesk chưa cài xong (không thấy service/exe)' }
              Start-Sleep -Seconds 10
              Write-Host "│ ✅ Đã cài RustDesk" -ForegroundColor Green

              Stop-Service -Name 'RustDesk' -Force -ErrorAction SilentlyContinue
              Get-Process -Name 'rustdesk' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
              if (Test-Path (Join-Path $bkCfg 'RustDesk.toml')) {
                  New-Item -ItemType Directory -Force -Path $svcCfg | Out-Null
                  robocopy $bkCfg $svcCfg /E /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
                  $global:LASTEXITCODE = 0
                  Write-Host "│ ✅ Đã khôi phục cấu hình RustDesk của phiên trước" -ForegroundColor Green
              } else {
                  Write-Host "│ ℹ️  Chưa có cấu hình RustDesk cũ (phiên đầu) - tạo ID mới và lưu lại" -ForegroundColor Cyan
              }
              Start-Service -Name 'RustDesk'
              Start-Sleep -Seconds 8

              if ($env:RUSTDESK_PASSWORD_SECRET) {
                  $pw = $env:RUSTDESK_PASSWORD_SECRET; $passText = '(secret RUSTDESK_PASSWORD)'
              } else {
                  $pw = $env:RDP_PASS; $passText = '(giống mật khẩu RDP)'
              }
              if ($pw) {
                  $pp = Start-Process -FilePath $rd -ArgumentList @('--password', "`"$pw`"") -PassThru -WindowStyle Hidden
                  if (-not $pp.WaitForExit(30000)) { Stop-Process -Id $pp.Id -Force -ErrorAction SilentlyContinue }
                  Write-Host "│ ✅ Đã đặt mật khẩu truy cập vĩnh viễn" -ForegroundColor Green
              }

              $id = $null
              for ($i = 0; $i -lt 10 -and -not $id; $i++) {
                  Start-Sleep -Seconds 3
                  $out = (& $rd --get-id | Out-String)$m = [regex]::Match($out, '(?m)^\s*(\d{6,12})\s*$')
                  if ($m.Success) { $id =$m.Groups[1].Value }
              }
              if (-not $id -and (Test-Path (Join-Path$svcCfg 'RustDesk.toml'))) {
                  $m = [regex]::Match((Get-Content -Raw (Join-Path$svcCfg 'RustDesk.toml')), "(?m)^id\s*=\s*'(\d+)'")
                  if ($m.Success) { $id =$m.Groups[1].Value }
              }
              if (-not $id) { throw 'Không đọc được ID RustDesk' }

              $oldId = if (Test-Path$idFile) { (Get-Content -Raw $idFile).Trim() } else {$null }
              if ($oldId -and $oldId -ne$id) {
                  Write-Host "│ ⚠️  ID ĐÃ ĐỔI (cũ: $oldId -> mới: $id) - chưa giữ được ID cố định" -ForegroundColor Yellow
              } elseif ($oldId) {
                  Write-Host "│ ✅ ID RustDesk giữ nguyên: $id" -ForegroundColor Green
              } else {
                  Write-Host "│ ✅ ID RustDesk (phiên đầu): $id" -ForegroundColor Green
              }
              Set-Content -Path $idFile -Value$id -Encoding ASCII

              "RUSTDESK_ID=$id" >> $env:GITHUB_ENV
              "RUSTDESK_PASS_TEXT=$passText" >> $env:GITHUB_ENV
          } catch {
              Write-Host "⚠️ RustDesk lỗi, bỏ qua: $($_.Exception.Message)" -ForegroundColor Yellow
          }
          $global:LASTEXITCODE = 0
          exit 0

      # ───────────────────────────────────────────────
      # 9. LƯU STATE ĐẦU PHIÊN & HIỂN THỊ THÔNG TIN
      # ───────────────────────────────────────────────
      - name: 💾 Lưu trạng thái phiên vào ổ riêng & GitHub
        shell: pwsh
        env:
          WINDOWS_IMAGE: ${{ inputs.windows_image }}
        run: |
          $savePass = if ($env:RDP_PASS_SOURCE -eq 'secret') { $null } else {$env:RDP_PASS }

          $state = [ordered]@{
              user            = $env:RDP_USER
              sid             = (Get-LocalUser -Name $env:RDP_USER).SID.Value
              password        = $savePass
              passwordSource  = $env:RDP_PASS_SOURCE
              windowsImage    = $env:WINDOWS_IMAGE
              osBuild         = $env:OS_BUILD
              driveLetter     = $env:MOUNT_LETTER
              tailscaleIp     = $env:TAILSCALE_IP
              durationMinutes = [int]$env:TOTAL_MINUTES
              startUtc        = (Get-Date).ToUniversalTime().ToString('o')
              runId           = $env:GITHUB_RUN_ID
              lastUpdatedUtc  = (Get-Date).ToUniversalTime().ToString('o')
          }
          $state | ConvertTo-Json -Depth 5 -Compress | Set-Content -Path$env:SHARED_STATE_FILE -Encoding UTF8

          $keep = Join-Path$env:SHARED_DATA_DIR '.gitkeep'
          if (-not (Test-Path $keep)) { New-Item -ItemType File -Path$keep -Force | Out-Null }

          & (Join-Path $env:RUNNER_TEMP 'save-data.ps1') -Reason 'session-start'
          exit 0

      - name: 🎉 THÔNG TIN KẾT NỐI
        shell: pwsh
        run: |
          $tz    = [System.TimeZoneInfo]::FindSystemTimeZoneById('SE Asia Standard Time')
          $start = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTimeOffset]::FromUnixTimeSeconds([long]$env:JOB_START_EPOCH).UtcDateTime, $tz)$end   = $start.AddMinutes([int]$env:TOTAL_MINUTES)

          $passText = if ($env:RDP_PASS_SOURCE -eq 'secret') { '(dùng secret RDP_PASSWORD)' } else { $env:RDP_PASS }

          Write-Host ""
          Write-Host "┌──────────────────────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host "│              🎉 KẾT NỐI & Ổ ĐĨA GITHUB SẴN SÀNG!         │" -ForegroundColor Cyan
          Write-Host "├──────────────────────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "│ 🌐  Địa chỉ      : $env:TAILSCALE_IP (Port: 3389)" -ForegroundColor White
          if ($env:DUCKDNS_HOST) { Write-Host "│ 🦆  Tên miền     : $env:DUCKDNS_HOST" -ForegroundColor White }
          if ($env:RUSTDESK_ID)  { Write-Host "│ 🖥️  RustDesk ID  : $env:RUSTDESK_ID  |  MK:$env:RUSTDESK_PASS_TEXT" -ForegroundColor White }
          Write-Host "│ 👤  Tài khoản    : $env:RDP_USER" -ForegroundColor White
          Write-Host "│ 🔐  Mật khẩu     : $passText" -ForegroundColor White
          Write-Host "│ 🪟  Windows      : ${{ inputs.windows_image }} (build$env:OS_BUILD)" -ForegroundColor White
          Write-Host "│ 💽  Ổ đĩa riêng  : $($env:MOUNT_LETTER):\ ($env:SHARED_ROOT)" -ForegroundColor Green
          Write-Host "│ 👤  Profile gốc  : $env:PROFILE_PATH" -ForegroundColor Green
          Write-Host "│ 🗂️  Kho dữ liệu  : $env:SHARED_DATA_DIR" -ForegroundColor Green
          Write-Host "│ 📦  Thư mục App  : $($env:MOUNT_LETTER):\Apps & C:\Program Files (tự đồng bộ)" -ForegroundColor Green
          Write-Host "│ ⏰  Thời lượng   : $env:DISPLAY_TIME ($($start.ToString('HH:mm:ss')) -> $($end.ToString('HH:mm:ss')))" -ForegroundColor White
          Write-Host "├──────────────────────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "│ 💡 Toàn bộ ổ $($env:MOUNT_LETTER):\, Profile, App cài ở C:\ tự lưu thẳng vào GitHub" -ForegroundColor Yellow
          Write-Host "│ 💡 Tự động backup định kỳ và đóng gói đầy đủ khi chuyển phiên" -ForegroundColor Yellow
          Write-Host "└──────────────────────────────────────────────────────────┘" -ForegroundColor Cyan
          exit 0

      # ───────────────────────────────────────────────
      # 10. DUY TRÌ PHIÊN + AUTOSAVE LÊN GITHUB
      # ───────────────────────────────────────────────
      - name: ⏳ DUY TRÌ PHIÊN LÀM VIỆC
        id: keepalive
        shell: pwsh
        env:
          AUTOSAVE_MINUTES: '20'
        run: |
          $tz         = [System.TimeZoneInfo]::FindSystemTimeZoneById('SE Asia Standard Time')
          $endEpoch   = [long]$env:JOB_START_EPOCH + ([long]$env:TOTAL_MINUTES * 60)$saveScript = Join-Path $env:RUNNER_TEMP 'save-data.ps1'$endLocal   = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTimeOffset]::FromUnixTimeSeconds($endEpoch).UtcDateTime, $tz)

          Write-Host ""
          Write-Host "🔄 BẮT ĐẦU DUY TRÌ PHIÊN LÀM VIỆC..." -ForegroundColor Yellow
          Write-Host "🔗 Kết nối: $env:TAILSCALE_IP" -ForegroundColor Cyan
          Write-Host "🗂️ Ổ đĩa riêng: $($env:MOUNT_LETTER):\ ($env:SHARED_DATA_DIR)" -ForegroundColor Cyan
          Write-Host "🕐 Kết thúc dự kiến: $($endLocal.ToString('HH:mm:ss'))" -ForegroundColor Green
          Write-Host ""

          $lastSave = Get-Date$lastLog  = (Get-Date).AddHours(-1)
          $warned   =$false

          while ($true) {
              $now    = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()$remain = $endEpoch -$now
              if ($remain -le 0) { break }

              if (((Get-Date) - $lastLog).TotalMinutes -ge 5) {
                  $svc  = Get-Service -Name TermService -ErrorAction SilentlyContinue$conn = @(Get-NetTCPConnection -LocalPort 3389 -State Established -ErrorAction SilentlyContinue).Count
                  $h = [math]::Floor($remain / 3600); $m = [math]::Floor(($remain % 3600) / 60)
                  Write-Host "[$(Get-Date -Format 'HH:mm:ss')] 📊 RDP: $($svc.Status) | Kết nối: $conn | Còn lại: ${h}h${m}m" -ForegroundColor Blue
                  $lastLog = Get-Date
              }

              $svc = Get-Service -Name TermService -ErrorAction SilentlyContinue
              if ($svc -and$svc.Status -ne 'Running') {
                  Write-Host "🔄 Khởi động lại TermService..." -ForegroundColor Yellow
                  Start-Service -Name TermService -ErrorAction SilentlyContinue
              }

              if (-not $warned -and$remain -le 300) {
                  try { msg * /TIME:290 "Phien RDP sap het gio (5 phut). He thong se tu dong dong goi toan bo o dia $($env:MOUNT_LETTER): luu len GitHub!" } catch {}
                  $warned =$true
              }

              if ((((Get-Date) - $lastSave).TotalMinutes -ge [int]$env:AUTOSAVE_MINUTES) -and $remain -gt 240) {
                  &$saveScript -Reason 'autosave'
                  $global:LASTEXITCODE = 0$lastSave = Get-Date
              }

              Start-Sleep -Seconds ([int][math]::Min(30, [math]::Max(1, $remain)))
          }

          Write-Host ""
          Write-Host "🎯 ĐÃ HẾT THỜI GIAN - TỰ ĐỘNG DỪNG VÀ LƯU Ổ ĐĨA!" -ForegroundColor Red
          exit 0

      # ───────────────────────────────────────────────
      # 11. LƯU CUỐI PHIÊN LÊN GITHUB
      # ───────────────────────────────────────────────
      - name: 💾 Lưu toàn bộ ổ đĩa cuối phiên lên GitHub
        if: always()
        shell: pwsh
        run: |
          $saveScript = Join-Path$env:RUNNER_TEMP 'save-data.ps1'
          if (-not (Test-Path $saveScript)) {
              Write-Host 'ℹ️ Không có script lưu, bỏ qua' -ForegroundColor Cyan
              exit 0
          }

          & $saveScript -Reason 'session-end-1'$global:LASTEXITCODE = 0

          $u =$env:RDP_USER
          if ($u) {
              try {
                  $loggedOff =$false
                  (quser 2>$null) | Select-Object -Skip 1 | ForEach-Object {
                      $parts = (($_ -replace '^>', ' ').Trim()) -split '\s+'
                      if ($parts.Count -gt 1 -and$parts[0] -ieq $u) {$id = $parts[1..($parts.Count - 1)] | Where-Object { $_ -match '^\d+$' } | Select-Object -First 1
                          if ($id) { logoff$id 2>&1 | Out-Null; $loggedOff =$true }
                      }
                  }
                  if ($loggedOff) {
                      Write-Host "🔒 Đã đăng xuất user $u, chờ nhả khóa file..." -ForegroundColor Cyan
                      Start-Sleep -Seconds 15
                      & $saveScript -Reason 'session-end'
                  }
              } catch {
                  Write-Host "⚠️ Không đăng xuất được user: $($_.Exception.Message)" -ForegroundColor Yellow
              }
          }
          $global:LASTEXITCODE = 0
          exit 0

      # ───────────────────────────────────────────────
      # 12. DỌN DẸP HỆ THỐNG
      # ───────────────────────────────────────────────
      - name: 🧹 DỌN DẸP HỆ THỐNG
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "🧹 ĐANG DỌN DẸP HỆ THỐNG..." -ForegroundColor Yellow

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $u  = if ($env:RDP_USER) {$env:RDP_USER } else { 'AISTV-D' }

          $cleanupSteps = @(
              @{Name='Vô hiệu hóa user'; Script={
                  Disable-LocalUser -Name $u -ErrorAction SilentlyContinue
              }},
              @{Name='Đóng kết nối mạng'; Script={
                  if (Test-Path $ts) {
                      & $ts logout 2>&1 | Out-Null
                      & $ts down 2>&1 | Out-Null
                  }
              }},
              @{Name='Xóa rule firewall'; Script={
                  Remove-NetFirewallRule -DisplayName 'RDP-Premium' -ErrorAction SilentlyContinue
              }},
              @{Name='Khôi phục cài đặt RDP'; Script={
                  Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 1 -Force -ErrorAction SilentlyContinue
                  Stop-Service -Name TermService -Force -ErrorAction SilentlyContinue
              }}
          )

          foreach ($step in$cleanupSteps) {
              try {
                  & $step.Script
                  Write-Host "│ ✅ $($step.Name)" -ForegroundColor Green
              } catch {
                  Write-Host "│ ⚠️  $($step.Name) - đã xử lý an toàn" -ForegroundColor Yellow
              }
          }

          Write-Host "🎉 Dọn dẹp hoàn tất! Hẹn gặp lại! 👋" -ForegroundColor Green
          exit 0

      # ───────────────────────────────────────────────
      # 13. KÍCH HOẠT PHIÊN TIẾP THEO (GỌI LẠI Ổ ĐĨA)
      # ───────────────────────────────────────────────
      - name: 🔁 Kích hoạt phiên tiếp theo & Mở lại ổ đĩa
        if: ${{ always() && inputs.auto_restart && steps.keepalive.outcome == 'success' }}
        shell: pwsh
        env:
          DURATION: ${{ inputs.duration }}
          WIN_IMAGE: ${{ inputs.windows_image }}
          USER_IN: ${{ inputs.rdp_user }}
          PKGS: ${{ inputs.choco_packages }}
          OPT: ${{ inputs.optimize_windows }}
          DDNS: ${{ inputs.enable_duckdns }}
          RD: ${{ inputs.enable_rustdesk }}
        run: |
          $wf      = [System.IO.Path]::GetFileName(($env:GITHUB_WORKFLOW_REF -split '@')[0])$optStr  = "$($env:OPT)".ToLower()
          $ddnsStr = "$($env:DDNS)".ToLower()
          $rdStr   = "$($env:RD)".ToLower()

          Write-Host "Chạy lại workflow: $wf (ref:$env:GITHUB_REF_NAME) và gắn lại ổ $($env:MOUNT_LETTER):\" -ForegroundColor Cyan
          gh workflow run $wf --ref$env:GITHUB_REF_NAME `
              -f "duration=$($env:DURATION)" `
              -f auto_restart=true `
              -f "drive_letter=$($env:MOUNT_LETTER)" `
              -f "vhd_size_gb=$($env:VHD_SIZE_GB)" `
              -f "windows_image=$($env:WIN_IMAGE)" `
              -f "rdp_user=$($env:USER_IN)" `
              -f "choco_packages=$($env:PKGS)" `
              -f "optimize_windows=$optStr" `
              -f "enable_duckdns=$ddnsStr" `
              -f "enable_rustdesk=$rdStr"
          if ($LASTEXITCODE -ne 0) { throw 'Không kích hoạt được phiên mới' }
          Write-Host "✅ Đã kích hoạt phiên tiếp theo" -ForegroundColor Green
