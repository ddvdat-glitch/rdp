name: siêu bá ki của đạt lor kim (github native persistence)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: '🕐 Thời gian sử dụng (tính từ lúc job bắt đầu)'
        required: false
        default: '5h40m'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h40m'
      auto_restart:
        description: '🔁 Tự khởi động phiên mới sau khi hết giờ'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ký tự ổ đĩa ảo riêng biệt để chứa toàn bộ Hệ Điều Hành & Dữ Liệu'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 Dung lượng ổ đĩa ảo VHDX tối đa (GB - co giãn động)'
        required: false
        default: '45'
        type: string
      windows_image:
        description: '🪟 Bản Windows (GIỮ CỐ ĐỊNH giữa các phiên để app không lỗi)'
        required: false
        default: 'windows-2022'
        type: choice
        options:
          - 'windows-2022'
          - 'windows-2025'
      rdp_user:
        description: '👤 User riêng gắn với ổ lưu trữ'
        required: false
        default: 'AISTV-D'
        type: string
      choco_packages:
        description: '📦 App cài thêm bằng choco (tự động lưu vết sang phiên sau)'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚙️ Tối ưu Windows (múi giờ VN, tắt sleep, tắt Update/Defender realtime, giữ phiên RDP)'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 Cập nhật DuckDNS trỏ về IP Tailscale (cần secret DUCKDNS_TOKEN + DUCKDNS_DOMAIN)'
        required: false
        default: true
        type: boolean
      enable_rustdesk:
        description: '🖥️ Cài RustDesk với ID cố định (cấu hình lưu thẳng vào ổ riêng)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-stv-premium-github-drive-rdp
  cancel-in-progress: false

jobs:
  Premium-RDP-Setup:
    runs-on: ${{ inputs.windows_image }}
    timeout-minutes: 355

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: 'aistv-persistent-os-storage'
      STATE_BRANCH: 'aistv-drive-state'
      DRIVE_LETTER: ${{ inputs.drive_letter }}
      VHD_SIZE_GB: ${{ inputs.vhd_size_gb }}

    steps:
      # ───────────────────────────────────────────────
      # 1. KHỞI TẠO KHÔNG GIAN LƯU TRỮ & TẢI Ổ ĐĨA TỪ GITHUB
      # ───────────────────────────────────────────────
      - name: 🧱 Chuẩn bị thông số & Kho lưu trữ GitHub
        shell: pwsh
        env:
          INPUT_DURATION: ${{ inputs.duration }}
          INPUT_USER: ${{ inputs.rdp_user }}
        run: |
          "JOB_START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV

          switch ($env:INPUT_DURATION) {
              '1h'    { $total = 60;  $display = '1 giờ' }
              '3h'    { $total = 180; $display = '3 giờ' }
              default { $total = 340; $display = '5 giờ 40 phút' }
          }
          "TOTAL_MINUTES=$total" >> $env:GITHUB_ENV
          "DISPLAY_TIME=$display" >> $env:GITHUB_ENV

          $user = if ([string]::IsNullOrWhiteSpace($env:INPUT_USER)) { 'AISTV-D' } else { $env:INPUT_USER.Trim() }
          if ($user -notmatch '^[A-Za-z][A-Za-z0-9_-]{0,19}$') {
              Write-Host "❌ Tên user không hợp lệ" -ForegroundColor Red
              exit 1
          }
          "RDP_USER=$user" >> $env:GITHUB_ENV

          $dl = ($env:DRIVE_LETTER.Trim() -replace '[^A-Za-z]', '').ToUpper()
          if (-not $dl -or $dl -in @('C','D')) { $dl = 'X' }
          "MOUNT_LETTER=$dl" >> $env:GITHUB_ENV
          $sharedRoot = "${dl}:\AISTV-SYSTEM"

          # Chọn nơi đặt file VHDX vật lý trên ổ có dung lượng trống lớn nhất (ưu tiên D:, rồi C:)
          $hostDrive = 'D:\'
          if (-not (Test-Path 'D:\') -or ((Get-PSDrive D).Free -lt 30GB)) { $hostDrive = 'C:\' }
          $vhdContainer = Join-Path $hostDrive 'AISTV-VHD-HOST'
          New-Item -ItemType Directory -Force -Path $vhdContainer | Out-Null
          $vhdFile = Join-Path $vhdContainer 'aistv-os-disk.vhdx'

          "VHD_CONTAINER=$vhdContainer" >> $env:GITHUB_ENV
          "VHD_FILE=$vhdFile" >> $env:GITHUB_ENV
          "SHARED_ROOT=$sharedRoot" >> $env:GITHUB_ENV
          "SHARED_SESSION_DIR=$(Join-Path $sharedRoot 'sessions')" >> $env:GITHUB_ENV
          "SHARED_DATA_DIR=$(Join-Path $sharedRoot 'DATA')" >> $env:GITHUB_ENV
          "SHARED_OS_DIR=$(Join-Path $sharedRoot 'OS-OVERLAY')" >> $env:GITHUB_ENV
          "SHARED_STATE_FILE=$(Join-Path $sharedRoot 'sessions\rdp-session-state.json')" >> $env:GITHUB_ENV
          "PROFILE_ROOT=$(Join-Path $sharedRoot 'Users')" >> $env:GITHUB_ENV
          "PROFILE_BACKUP=C:\aistv-profile-old" >> $env:GITHUB_ENV

          $build = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuild
          "OS_BUILD=$build" >> $env:GITHUB_ENV

          # Đảm bảo Release trên GitHub tồn tại để chứa các chunk của ổ đĩa
          $relCheck = gh release view $env:RELEASE_TAG --repo $env:GH_REPO 2>&1
          if ($LASTEXITCODE -ne 0) {
              Write-Host "ℹ️ Tạo kho lưu trữ Release [$($env:RELEASE_TAG)] trên GitHub..." -ForegroundColor Cyan
              $dummy = Join-Path $env:RUNNER_TEMP 'init.txt'
              Set-Content -Path $dummy -Value "AI-STV Persistent Storage Initialized"
              gh release create $env:RELEASE_TAG $dummy --repo $env:GH_REPO --title "AI-STV Persistent OS Drive" --notes "Kho lưu trữ ổ đĩa tự động giữa các phiên (Không xóa)"
          }
          $global:LASTEXITCODE = 0
          Write-Host "✅ Ổ đĩa hệ thống đích: ${dl}:\ ($sharedRoot)" -ForegroundColor Green

      # ───────────────────────────────────────────────
      # 2. TẠO ENGINE ĐỒNG BỘ Ổ ĐĨA LÊN GITHUB (RELEASE CHUNKS + GIT BRANCH)
      # ───────────────────────────────────────────────
      - name: 🧰 Tạo script đóng gói & đẩy toàn bộ ổ đĩa lên GitHub
        shell: pwsh
        run: |
          $script = @'
          param(
              [string]$Reason = 'save',
              [switch]$FullUnmount = $false
          )
          $ErrorActionPreference = 'Continue'

          if ($env:DATA_RESTORED -ne '1') {
              Write-Host '⚠️ Dữ liệu chưa khôi phục xong, bỏ qua lưu để tránh ghi đè rỗng' -ForegroundColor Yellow
              exit 0
          }

          $root = $env:SHARED_ROOT
          $osDir = $env:SHARED_OS_DIR
          if (-not $root -or -not (Test-Path $root)) {
              Write-Host 'ℹ️ Chưa thấy ổ đĩa chung, bỏ qua'
              exit 0
          }

          Write-Host "💾 [$Reason] Đang thu thập trạng thái Hệ Điều Hành, Registry, Services & App..." -ForegroundColor Cyan

          # 1. Xuất toàn bộ nhánh Registry quan trọng của hệ thống & phần mềm đã cài
          $regBk = Join-Path $osDir 'Registry'
          New-Item -ItemType Directory -Force -Path $regBk | Out-Null
          reg export "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" (Join-Path $regBk 'Uninstall-x64.reg') /y *> $null
          reg export "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall" (Join-Path $regBk 'Uninstall-x86.reg') /y *> $null
          reg export "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" (Join-Path $regBk 'System-Env.reg') /y *> $null

          # Xuất HKCU của user nếu đang load
          $u = $env:RDP_USER
          if ($u) {
              $userObj = Get-LocalUser -Name $u -ErrorAction SilentlyContinue
              if ($userObj) {
                  $sid = $userObj.SID.Value
                  if (Test-Path "Registry::HKU\$sid") {
                      reg export "HKU\$sid\Environment" (Join-Path $regBk 'User-Env.reg') /y *> $null
                      reg export "HKU\$sid\Software" (Join-Path $regBk 'User-Software.reg') /y *> $null
                  }
              }
          }

          # 2. Đồng bộ cấu hình RustDesk, Tailscale State, Choco Lib & ProgramData quan trọng
          try {
              $rdCfg = 'C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config'
              if (Test-Path (Join-Path $rdCfg 'RustDesk.toml')) {
                  $rdBk = Join-Path $env:SHARED_SESSION_DIR 'rustdesk-config'
                  New-Item -ItemType Directory -Force -Path $rdBk | Out-Null
                  robocopy $rdCfg $rdBk /MIR /B /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
              }
              $tsData = 'C:\ProgramData\Tailscale'
              if (Test-Path $tsData) {
                  $tsBk = Join-Path $osDir 'Tailscale-State'
                  New-Item -ItemType Directory -Force -Path $tsBk | Out-Null
                  robocopy $tsData $tsBk /MIR /B /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
              }
              if (Test-Path 'C:\ProgramData\chocolatey\lib') {
                  $chocoBk = Join-Path $osDir 'chocolatey-lib'
                  New-Item -ItemType Directory -Force -Path $chocoBk | Out-Null
                  robocopy 'C:\ProgramData\chocolatey\lib' $chocoBk /MIR /B /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
              }
          } catch {}
          $global:LASTEXITCODE = 0

          # 3. Cập nhật file state JSON
          $stateFile = $env:SHARED_STATE_FILE
          if ($stateFile -and (Test-Path $stateFile)) {
              try {
                  $st = Get-Content -Raw $stateFile | ConvertFrom-Json
                  $st.lastUpdatedUtc = (Get-Date).ToUniversalTime().ToString('o')
                  $st.lastSaveReason = $Reason
                  $st | ConvertTo-Json -Depth 5 | Set-Content -Path $stateFile -Encoding UTF8
              } catch {}
          }

          # 4. Đẩy state & metadata trực tiếp vào nhánh Git (aistv-drive-state) trên repo
          try {
              $gitStage = Join-Path $env:RUNNER_TEMP 'git-state-sync'
              if (Test-Path $gitStage) { Remove-Item $gitStage -Recurse -Force -ErrorAction SilentlyContinue }
              New-Item -ItemType Directory -Force -Path $gitStage | Out-Null
              Push-Location $gitStage
              git init -q
              git config user.name "AI-STV-Bot"
              git config user.email "bot@aistv.local"
              git remote add origin "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:GH_REPO).git"
              git fetch origin $env:STATE_BRANCH -q 2>$null
              if ($LASTEXITCODE -eq 0) {
                  git checkout -B $env:STATE_BRANCH "origin/$($env:STATE_BRANCH)" -q
              } else {
                  git checkout --orphan $env:STATE_BRANCH -q
              }
              robocopy $env:SHARED_SESSION_DIR (Join-Path $gitStage 'sessions') /MIR /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
              robocopy $regBk (Join-Path $gitStage 'registry') /MIR /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
              $global:LASTEXITCODE = 0
              git add -A
              git commit -m "Sync session state [$Reason] at $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" -q 2>$null
              git push -u origin $env:STATE_BRANCH --force -q 2>$null
              Pop-Location
              Write-Host "✅ [$Reason] Đã lưu state & registry lên nhánh Git ($($env:STATE_BRANCH))" -ForegroundColor Green
          } catch {
              if ((Get-Location).Path -eq $gitStage) { Pop-Location }
          }

          # 5. Đóng gói toàn bộ ổ đĩa riêng thành các phân mảnh 1900MB và đẩy thẳng lên GitHub Release
          $packDir = Join-Path $env:RUNNER_TEMP "gh-pack-$Reason"
          if (Test-Path $packDir) { Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $packDir | Out-Null

          $archiveBase = Join-Path $packDir 'aistv-drive.7z'
          Write-Host "📦 [$Reason] Đang nén toàn bộ ổ đĩa $root (đa luồng, đọc cả file đang mở)..." -ForegroundColor Cyan

          # Dùng 7z với cờ -ssw (nén cả file đang bị giữ khoá đọc/ghi) và cắt mỗi mảnh 1900MB (dưới ngưỡng 2GB của GitHub Release)
          & 7z a -t7z -mx=1 -mmt=on -ssw -v1900m "$archiveBase" "$root\*" `-xr!"*\Pagefile.sys" `-xr!"*\System Volume Information" *> $null
          $7zCode = $LASTEXITCODE

          $chunks = @(Get-ChildItem -Path $packDir -Filter 'aistv-drive.7z.*' | Sort-Object Name)
          if ($chunks.Count -eq 0) {
              Write-Host "❌ [$Reason] Không tạo được gói nén ổ đĩa (mã 7z: $7zCode)" -ForegroundColor Red
              exit 1
          }

          # Tạo bảng kê manifest các phân mảnh để phiên sau tải về ghép lại chuẩn xác 100%
          $manifest = [ordered]@{
              updatedUtc = (Get-Date).ToUniversalTime().ToString('o')
              reason     = $Reason
              osBuild    = $env:OS_BUILD
              chunkCount = $chunks.Count
              chunks     = @($chunks | ForEach-Object {
                  [ordered]@{
                      name = $_.Name
                      size = $_.Length
                  }
              })
          }
          $manifestPath = Join-Path $packDir 'drive-manifest.json'
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path $manifestPath -Encoding UTF8

          Write-Host "⬆️  [$Reason] Đang tải $($chunks.Count) mảnh ổ đĩa lên GitHub Release ($($env:RELEASE_TAG))..." -ForegroundColor Cyan
          $uploadFiles = @($chunks | ForEach-Object { $_.FullName }) + @($manifestPath)
          gh release upload $env:RELEASE_TAG @uploadFiles --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ [$Reason] Upload lên GitHub Release thất bại" -ForegroundColor Red
              Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue
              exit 1
          }

          # Dọn các mảnh thừa của lần lưu trước nếu dung lượng ổ giảm (ít mảnh hơn trước)
          try {
              $relJson = gh release view $env:RELEASE_TAG --repo $env:GH_REPO --json assets | ConvertFrom-Json
              $validNames = @($chunks.Name) + @('drive-manifest.json', 'init.txt')
              foreach ($asset in $relJson.assets) {
                  if ($asset.name -like 'aistv-drive.7z.*' -and ($asset.name -notin $validNames)) {
                      gh release delete-asset $env:RELEASE_TAG $asset.name --repo $env:GH_REPO -y *> $null
                  }
              }
          } catch {}

          Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "✅ [$Reason] Đã lưu trọn vẹn toàn bộ ổ đĩa lên GitHub!" -ForegroundColor Green
          exit 0
          '@
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'save-data.ps1') -Value $script -Encoding UTF8
          Write-Host '✅ Đã tạo save-data.ps1 (GitHub Native Storage Engine)' -ForegroundColor Green

      # ───────────────────────────────────────────────
      # 3. DỰNG Ổ ĐĨA ẢO VHDX RIÊNG & KHÔI PHỤC DỮ LIỆU TỪ GITHUB
      # ───────────────────────────────────────────────
      - name: ♻️ Dựng ổ đĩa riêng & Khôi phục toàn bộ dữ liệu từ GitHub
        shell: pwsh
        run: |
          $dl = $env:MOUNT_LETTER
          $vhd = $env:VHD_FILE
          $sizeBytes = ([int64]$env:VHD_SIZE_GB) * 1GB

          Write-Host "💽 Đang khởi tạo ổ đĩa riêng ${dl}:\ ($($env:VHD_SIZE_GB) GB Dynamic VHDX)..." -ForegroundColor Cyan
          $ mounted = $false
          try {
              if (-not (Test-Path $vhd)) {
                  New-VHD -Path $vhd -SizeBytes $sizeBytes -Dynamic | Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -DriveLetter $dl -UseMaximumSize | Format-Volume -FileSystem NTFS -NewFileSystemLabel 'AISTV-OS' -Confirm:$false | Out-Null
              } else {
                  Mount-VHD -Path $vhd
              }
              if (Test-Path "${dl}:\") { $mounted = $true }
          } catch {
              Write-Host "⚠️ Máy chủ không cho phép tạo VHDX trực tiếp ($($_.Exception.Message)), chuyển sang cơ chế Ổ Đĩa Ảo SUBST gắn cứng..." -ForegroundColor Yellow
          }

          if (-not $mounted) {
              $fallbackDir = Join-Path $env:VHD_CONTAINER 'VIRTUAL-DRIVE-ROOT'
              New-Item -ItemType Directory -Force -Path $fallbackDir | Out-Null
              & subst "${dl}:" $fallbackDir
              # Đăng ký DosDevices vào HKLM để mọi Service, SYSTEM và phiên RDP đều nhìn thấy ổ đĩa này
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force
          }

          foreach ($p in @($env:SHARED_ROOT, $env:SHARED_SESSION_DIR, $env:SHARED_DATA_DIR, $env:SHARED_OS_DIR, $env:PROFILE_ROOT)) {
              New-Item -ItemType Directory -Force -Path $p | Out-Null
          }

          # Kiểm tra xem trên GitHub Release đã có bản lưu ổ đĩa nào chưa
          $dlDir = Join-Path $env:RUNNER_TEMP 'gh-restore'
          if (Test-Path $dlDir) { Remove-Item $dlDir -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $dlDir | Out-Null

          gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern 'drive-manifest.json' --dir $dlDir 2>$null
          $manifestFile = Join-Path $dlDir 'drive-manifest.json'

          if (-not (Test-Path $manifestFile)) {
              Write-Host "ℹ️ Chưa có bản lưu ổ đĩa trên GitHub - đây là phiên khởi tạo đầu tiên!" -ForegroundColor Cyan
              'DATA_RESTORED=1' >> $env:GITHUB_ENV
              exit 0
          }

          $manifest = Get-Content -Raw $manifestFile | ConvertFrom-Json
          Write-Host "⬇️  Phát hiện ổ đĩa từ phiên trước ($($manifest.chunkCount) mảnh, cập nhật lúc $($manifest.updatedUtc)). Đang tải về..." -ForegroundColor Cyan

          gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern 'aistv-drive.7z.*' --dir $dlDir
          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ Lỗi tải các mảnh ổ đĩa từ GitHub Release. Dừng phiên để bảo vệ dữ liệu gốc!" -ForegroundColor Red
              exit 1
          }

          $firstChunk = Join-Path $dlDir 'aistv-drive.7z.001'
          if (-not (Test-Path $firstChunk)) {
              Write-Host "❌ Thiếu mảnh ghép đầu tiên (aistv-drive.7z.001)!" -ForegroundColor Red
              exit 1
          }

          $stage = Join-Path $env:VHD_CONTAINER 'restore-stage'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Write-Host "📂 Đang bung toàn bộ ổ đĩa vào ${dl}:\..." -ForegroundColor Cyan
          & 7z x "$firstChunk" "-o$stage" -y -mmt=on *> $null
          Remove-Item $dlDir -Recurse -Force -ErrorAction SilentlyContinue

          # Chuyển toàn bộ dữ liệu (trừ thư mục Users đang chờ nạp profile) vào ổ riêng
          robocopy $stage $env:SHARED_ROOT /E /B /XJ /XD (Join-Path $stage 'Users') /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
          $global:LASTEXITCODE = 0

          # Giữ riêng Profile cũ để bước tạo User nạp chuẩn SID + NTUSER.DAT
          $oldProf = Join-Path $stage "Users\$($env:RDP_USER)"
          if (Test-Path $oldProf) {
              if (Test-Path $env:PROFILE_BACKUP) { Remove-Item $env:PROFILE_BACKUP -Recurse -Force -ErrorAction SilentlyContinue }
              robocopy $oldProf $env:PROFILE_BACKUP /E /B /XJ /COPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
              $global:LASTEXITCODE = 0
              Write-Host "✅ Đã bóc tách Profile cũ (gồm Desktop, AppData, Registry NTUSER.DAT)" -ForegroundColor Green
          }
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue

          # Nạp lại các khóa Registry hệ thống, biến môi trường và danh sách phần mềm từ ổ riêng
          $regBk = Join-Path $env:SHARED_OS_DIR 'Registry'
          if (Test-Path $regBk) {
              Get-ChildItem $regBk -Filter '*.reg' | Where-Object { $_.Name -notlike 'User-*' } | ForEach-Object {
                  reg import $_.FullName *> $null
              }
              Write-Host "✅ Đã nạp lại Registry hệ thống & biến môi trường từ ổ riêng" -ForegroundColor Green
          }

          # Khôi phục Chocolatey lib nếu có
          $chocoBk = Join-Path $env:SHARED_OS_DIR 'chocolatey-lib'
          if (Test-Path $chocoBk) {
              New-Item -ItemType Directory -Force -Path 'C:\ProgramData\chocolatey\lib' | Out-Null
              robocopy $chocoBk 'C:\ProgramData\chocolatey\lib' /E /B /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
              $global:LASTEXITCODE = 0
          }

          if (Test-Path $env:SHARED_STATE_FILE) {
              try {
                  $state = Get-Content -Raw $env:SHARED_STATE_FILE | ConvertFrom-Json
                  if ($state.password) {
                      "RESTORE_PASS=$($state.password)" >> $env:GITHUB_ENV
                      Write-Host "✅ Đã khôi phục mật khẩu từ phiên trước" -ForegroundColor Green
                  }
                  if ($state.sid) { "RESTORE_SID=$($state.sid)" >> $env:GITHUB_ENV }
              } catch {}
          }

          'DATA_RESTORED=1' >> $env:GITHUB_ENV
          Write-Host "✅ Khôi phục toàn bộ ổ đĩa từ GitHub hoàn tất!" -ForegroundColor Green
          exit 0

      # ───────────────────────────────────────────────
      # 4. ÁNH XẠ HỆ ĐIỀU HÀNH SANG Ổ RIÊNG (OS OVERLAY JUNCTIONS)
      # ───────────────────────────────────────────────
      - name: 🔗 Gắn kết thư mục Hệ Điều Hành & Phần Mềm sang ổ riêng
        shell: pwsh
        run: |
          $osDir = $env:SHARED_OS_DIR
          $appsDir = Join-Path $osDir 'InstalledApps'
          $progDataDir = Join-Path $osDir 'ProgramData-Custom'
          $binDir = Join-Path $osDir 'bin'
          $chocoCache = Join-Path $osDir 'choco-cache'

          foreach ($d in @($appsDir, $progDataDir, $binDir, $chocoCache)) {
              New-Item -ItemType Directory -Force -Path $d | Out-Null
          }

          # Đổi hướng cài đặt phần mềm mặc định của Windows (ProgramFilesDir) sang ổ đĩa riêng
          # Mọi bộ cài đặt .exe / .msi chạy trong phiên sẽ tự động cài thẳng vào ổ riêng!
          $cvKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion'
          Set-ItemProperty -Path $cvKey -Name 'ProgramFilesDir' -Value $appsDir -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $cvKey -Name 'ProgramFilesDir (x86)' -Value (Join-Path $osDir 'InstalledApps-x86') -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $osDir 'InstalledApps-x86') | Out-Null

          # Tạo Junction C:\AISTV-Apps trỏ thẳng sang ổ riêng để đường dẫn tuyệt đối không bao giờ gãy
          if (-not (Test-Path 'C:\AISTV-Apps')) {
              New-Item -ItemType Junction -Path 'C:\AISTV-Apps' -Target $appsDir -Force | Out-Null
          }

          # Thêm thư mục bin trên ổ riêng vào System PATH vĩnh viễn
          $sysEnv = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
          $curPath = (Get-ItemProperty -Path $sysEnv -Name 'Path').Path
          if ($curPath -notlike "*$binDir*") {
              Set-ItemProperty -Path $sysEnv -Name 'Path' -Value "$binDir;$curPath" -Force
          }

          Write-Host "✅ Đã chuyển hướng trình cài đặt Windows & PATH sang ổ đĩa riêng: $appsDir" -ForegroundColor Green

      # ───────────────────────────────────────────────
      # 5. CẤU HÌNH RDP & TỐI ƯU HỆ THỐNG
      # ───────────────────────────────────────────────
      - name: 🔧 CẤU HÌNH HỆ THỐNG RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          $p = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $p -Name 'UserAuthentication' -Value 0 -Force
          Set-ItemProperty -Path $p -Name 'SecurityLayer' -Value 0 -Force

          Remove-NetFirewallRule -DisplayName 'RDP-Premium' -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName 'RDP-Premium' -Direction Inbound -Action Allow `
              -Protocol TCP -LocalPort 3389 -RemoteAddress '100.64.0.0/10' -Profile Any | Out-Null

          Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue
          Set-Service -Name UmRdpService -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name TermService -ErrorAction SilentlyContinue
          Start-Service -Name UmRdpService -ErrorAction SilentlyContinue
          Write-Host "✅ Đã cấu hình Remote Desktop" -ForegroundColor Green

      - name: ⚙️ TỐI ƯU WINDOWS
        if: ${{ inputs.optimize_windows }}
        shell: pwsh
        run: |
          tzutil /s 'SE Asia Standard Time'
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change disk-timeout-ac 0
          powercfg /hibernate off

          $p = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item -Path $p -Force | Out-Null
          Set-ItemProperty -Path $p -Name 'MaxIdleTime' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $p -Name 'MaxDisconnectionTime' -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $p -Name 'fResetBroken' -Value 0 -Type DWord -Force

          Stop-Service -Name wuauserv -Force -ErrorAction SilentlyContinue
          Set-Service -Name wuauserv -StartupType Disabled -ErrorAction SilentlyContinue
          Stop-Service -Name UsoSvc -Force -ErrorAction SilentlyContinue
          Set-Service -Name UsoSvc -StartupType Disabled -ErrorAction SilentlyContinue
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Write-Host "✅ Đã tối ưu hoá Windows (UTC+7, chống ngắt RDP, tắt Defender)" -ForegroundColor Green

      - name: 📦 CÀI APP (Tự động lưu danh sách gói vào ổ riêng cho các phiên sau)
        shell: pwsh
        env:
          PKGS: ${{ inputs.choco_packages }}
        run: |
          $pkgListFile = Join-Path $env:SHARED_OS_DIR 'installed-choco-packages.txt'
          $savedPkgs = @()
          if (Test-Path $pkgListFile) {
              $savedPkgs = @(Get-Content $pkgListFile | Where-Object { $_ -match '^[A-Za-z0-9._\-]+$' })
          }
          $inputPkgs = @()
          if (-not [string]::IsNullOrWhiteSpace($env:PKGS)) {
              $inputPkgs = @($env:PKGS -split '\s+' | Where-Object { $_ -match '^[A-Za-z0-9._\-]+$' })
          }
          $allPkgs = @($savedPkgs + $inputPkgs | Select-Object -Unique)
          if ($allPkgs.Count -gt 0) {
              $allPkgs | Set-Content -Path $pkgListFile -Encoding UTF8
              $chocoCache = Join-Path $env:SHARED_OS_DIR 'choco-cache'
              foreach ($p in $allPkgs) {
                  Write-Host "📦 Đang đồng bộ gói $p (sử dụng cache trên ổ riêng)..." -ForegroundColor Cyan
                  choco install $p -y --no-progress --limit-output --cache-location="$chocoCache"
                  $global:LASTEXITCODE = 0
              }
          }
          exit 0

      # ───────────────────────────────────────────────
      # 6. TẠO TÀI KHOẢN RIÊNG + GẮN TOÀN BỘ PROFILE LÊN Ổ ĐĨA RIÊNG
      # ───────────────────────────────────────────────
      - name: 👤 TẠO USER RIÊNG (PROFILE & REGISTRY NẰM TRÊN Ổ RIÊNG)
        shell: pwsh
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.RDP_PASSWORD }}
        run: |
          $user = $env:RDP_USER

          function Get-Pick([string]$s) {
              $s[[System.Security.Cryptography.RandomNumberGenerator]::GetInt32($s.Length)]
          }
          function New-PremiumPassword {
              $upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; $lower = 'abcdefghijkmnpqrstuvwxyz'; $numbers = '23456789'
              $all = $upper + $lower + $numbers
              $chars = @((Get-Pick $upper), (Get-Pick $lower), (Get-Pick $numbers))
              for ($i = 1; $i -le 9; $i++) { $chars += (Get-Pick $all) }
              -join ($chars | Sort-Object { [System.Security.Cryptography.RandomNumberGenerator]::GetInt32([int]::MaxValue) })
          }

          if ($env:RDP_PASSWORD_SECRET) {
              $matKhau = $env:RDP_PASSWORD_SECRET; $source = 'secret'
          } elseif ($env:RESTORE_PASS) {
              $matKhau = $env:RESTORE_PASS; $source = 'restored'
          } else {
              $matKhau = New-PremiumPassword; $source = 'generated'
          }

          $securePass = ConvertTo-SecureString $matKhau -AsPlainText -Force
          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name $user -ErrorAction SilentlyContinue
          }

          New-LocalUser -Name $user -Password $securePass -AccountNeverExpires -PasswordNeverExpires -Description 'AI STV Persistent User' | Out-Null
          Add-LocalGroupMember -Group 'Administrators' -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $user -ErrorAction SilentlyContinue
          Enable-LocalUser -Name $user

          "RDP_PASS=$matKhau" >> $env:GITHUB_ENV
          "RDP_PASS_SOURCE=$source" >> $env:GITHUB_ENV

          # Trỏ toàn bộ ProfilesDirectory sang ổ đĩa riêng
          $root = $env:PROFILE_ROOT
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $pl = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList'
          Set-ItemProperty -Path $pl -Name 'ProfilesDirectory' -Value $root -Type ExpandString -Force

          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class AistvProfile {
              [DllImport("userenv.dll", CharSet = CharSet.Unicode)]
              public static extern int CreateProfile(string pszUserSid, string pszUserName, StringBuilder pszProfilePath, uint cchProfilePath);
          }
          '@

          $sid = (Get-LocalUser -Name $user).SID.Value
          $sb  = New-Object System.Text.StringBuilder 260
          [void][AistvProfile]::CreateProfile($sid, $user, $sb, 260)
          $profPath = $sb.ToString()
          if ([string]::IsNullOrWhiteSpace($profPath) -or -not (Test-Path $profPath)) {
              $profPath = Join-Path $root $user
              New-Item -ItemType Directory -Force -Path $profPath | Out-Null
          }
          "PROFILE_PATH=$profPath" >> $env:GITHUB_ENV

          # Khôi phục toàn bộ dữ liệu Profile cũ (Desktop, Downloads, AppData, Chrome/Discord data, NTUSER.DAT)
          if ((Test-Path $env:PROFILE_BACKUP) -and (Test-Path $profPath)) {
              robocopy $env:PROFILE_BACKUP $profPath /E /B /XJ /COPY:DAT /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null
              $global:LASTEXITCODE = 0
              Remove-Item $env:PROFILE_BACKUP -Recurse -Force -ErrorAction SilentlyContinue
              # Cấp full quyền sở hữu thư mục profile cho user mới tạo để không bị lỗi Access Denied
              & icacls $profPath /setowner "$user" /T /C /Q *> $null
              & icacls $profPath /grant "${user}:(OI)(CI)F" /T /C /Q *> $null
              Write-Host "✅ Đã nạp lại toàn bộ Profile người dùng vào: $profPath" -ForegroundColor Green
          }

          # Tạo Shortcut trên Desktop trỏ vào ổ riêng và kho App
          try {
              $ws = New-Object -ComObject WScript.Shell
              $lnk1 = $ws.CreateShortcut('C:\Users\Public\Desktop\O-DIA-RIENG-AISTV.lnk')
              $lnk1.TargetPath = $env:SHARED_ROOT
              $lnk1.Save()

              $lnk2 = $ws.CreateShortcut('C:\Users\Public\Desktop\KHO-DU-LIEU.lnk')
              $lnk2.TargetPath = $env:SHARED_DATA_DIR
              $lnk2.Save()
          } catch {}
          exit 0

      # ───────────────────────────────────────────────
      # 7. MẠNG TAILSCALE (GIỮ NGUYÊN NODE KEY & IP GIỮA CÁC PHIÊN)
      # ───────────────────────────────────────────────
      - name: 🌐 THIẾT LẬP MẠNG TAILSCALE (GIỮ IP CỐ ĐỊNH TRÊN Ổ RIÊNG)
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: pwsh
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY) {
              Write-Host "❌ Thiếu secret TAILSCALE_AUTH_KEY" -ForegroundColor Red
              exit 1
          }

          $msiPath = "$env:TEMP\tailscale-premium.msi"
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $msiPath
          Start-Process msiexec.exe -ArgumentList '/i', "`"$msiPath`"", '/quiet', '/norestart' -Wait
          Remove-Item $msiPath -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 6

          # Khôi phục state Tailscale từ ổ riêng để giữ nguyên IP Tailscale của phiên trước
          $tsBk = Join-Path $env:SHARED_OS_DIR 'Tailscale-State'$tsData = 'C:\ProgramData\Tailscale'
          if (Test-Path (Join-Path $tsBk 'server-state.conf')) {
              Stop-Service Tailscale -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $tsData | Out-Null
              robocopy $tsBk $tsData /MIR /B /R:1 /W:1 /NFL /NDL /NJH /NJS /NP \vert{} Out-Null$global:LASTEXITCODE = 0
              Start-Service Tailscale -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 5
              Write-Host "✅ Đã nạp lại Node State Tailscale từ ổ riêng (Giữ nguyên IP)" -ForegroundColor Green
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up "--authkey=$($env:TAILSCALE_AUTH_KEY)" "--hostname=aistv-persistent-os" --accept-routes --accept-dns --unattended
          if ($LASTEXITCODE -ne 0) { &$ts up "--authkey=$($env:TAILSCALE_AUTH_KEY)" "--hostname=aistv-persistent-os" --accept-routes --accept-dns --reset
          }

          $ip =$null
          for ($i = 0; $i -lt 20; $i++) {
              $out = (&$ts ip -4 2>&1 | Out-String).Trim()
              if ($out -match '^\d+\.\d+\.\d+\.\d+$') { $ip =$out; break }
              Start-Sleep -Seconds 3
          }
          if (-not $ip) { Write-Host "❌ Không lấy được IP Tailscale" -ForegroundColor Red; exit 1 }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "✅ Địa chỉ IP Tailscale: $ip" -ForegroundColor Green

      # ───────────────────────────────────────────────
      # 8. DUCKDNS & RUSTDESK ID CỐ ĐỊNH
      # ───────────────────────────────────────────────
      - name: 🦆 CẬP NHẬT DUCKDNS
        if: ${{ inputs.enable_duckdns }}
        shell: pwsh
        env:
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
        run: |
          if (-not $env:DUCKDNS_TOKEN -or -not$env:DUCKDNS_DOMAIN -or -not $env:TAILSCALE_IP) { exit 0 }$domain = ($env:DUCKDNS_DOMAIN.Trim().ToLower()) -replace '\.duckdns\.org$', ''
          for ($i = 1; $i -le 3; $i++) {
              try {
                  $res = Invoke-RestMethod -Uri "https://www.duckdns.org/update?domains=$domain&token=$($env:DUCKDNS_TOKEN)&ip=$($env:TAILSCALE_IP)" -TimeoutSec 20
                  if ("$res".Trim() -eq 'OK') {
                      "DUCKDNS_HOST=${domain}.duckdns.org" >> $env:GITHUB_ENV
                      Write-Host "✅ ${domain}.duckdns.org ->$env:TAILSCALE_IP" -ForegroundColor Green
                      break
                  }
              } catch {}
              Start-Sleep -Seconds 4
          }
          exit 0

      - name: 🖥️ CÀI RUSTDESK (ID CỐ ĐỊNH LƯU TRÊN Ổ RIÊNG)
        if: ${{ inputs.enable_rustdesk }}
        timeout-minutes: 8
        continue-on-error: true
        shell: pwsh
        env:
          RUSTDESK_PASSWORD_SECRET: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          $svcCfg    = 'C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config'
          $bkCfg     = Join-Path$env:SHARED_SESSION_DIR 'rustdesk-config'
          $guidFile  = Join-Path$env:SHARED_SESSION_DIR 'rustdesk-machine-guid.txt'
          $idFile    = Join-Path$env:SHARED_SESSION_DIR 'rustdesk-id.txt'
          $rd        = "$env:ProgramFiles\RustDesk\rustdesk.exe"
          $installer = Join-Path$env:RUNNER_TEMP 'rustdesk-setup.exe'

          try {
              $cryptoKey = 'HKLM:\SOFTWARE\Microsoft\Cryptography'
              if (Test-Path $guidFile) {
                  $g = (Get-Content -Raw$guidFile).Trim()
                  if ($g -match '^[0-9a-fA-F-]{36}$') {
                      Set-ItemProperty -Path $cryptoKey -Name 'MachineGuid' -Value$g -Force
                  }
              } else {
                  $cur = (Get-ItemProperty -Path$cryptoKey).MachineGuid
                  Set-Content -Path $guidFile -Value$cur -Encoding ASCII
              }

              $url = 'https://github.com/rustdesk/rustdesk/releases/download/1.3.9/rustdesk-1.3.9-x86_64.exe'
              $ProgressPreference = 'SilentlyContinue'
              Invoke-WebRequest -Uri $url -OutFile$installer
              $inst = Start-Process -FilePath$installer -ArgumentList '--silent-install' -PassThru
              [void]$inst.WaitForExit(60000)
              Start-Sleep -Seconds 8

              Stop-Service -Name 'RustDesk' -Force -ErrorAction SilentlyContinue
              Get-Process -Name 'rustdesk' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
              if (Test-Path (Join-Path $bkCfg 'RustDesk.toml')) {
                  New-Item -ItemType Directory -Force -Path $svcCfg | Out-Null
                  robocopy $bkCfg $svcCfg /E /R:1 /W:1 /NFL /NDL /NJH /NJS /NP \vert{} Out-Null$global:LASTEXITCODE = 0
              }
              Start-Service -Name 'RustDesk'
              Start-Sleep -Seconds 6

              $pw = if ($env:RUSTDESK_PASSWORD_SECRET) { $env:RUSTDESK_PASSWORD_SECRET } else {$env:RDP_PASS }
              $passText = if ($env:RUSTDESK_PASSWORD_SECRET) { '(secret RUSTDESK_PASSWORD)' } else { '(giống mật khẩu RDP)' }
              if ($pw) {
                  $pp = Start-Process -FilePath$rd -ArgumentList @('--password', "`"$pw`"") -PassThru -WindowStyle Hidden
                  [void]$pp.WaitForExit(20000)
              }

              $id =$null
              for ($i = 0; $i -lt 8 -and -not $id; $i++) {
                  Start-Sleep -Seconds 2
                  $out = (& $rd --get-id \vert{} Out-String)$m = [regex]::Match($out, '(?m)^\s*(\d{6,12})\s*$')
                  if ($m.Success) { $id =$m.Groups[1].Value }
              }
              if ($id) {
                  Set-Content -Path $idFile -Value$id -Encoding ASCII
                  "RUSTDESK_ID=$id" >> $env:GITHUB_ENV
                  "RUSTDESK_PASS_TEXT=$passText" >> $env:GITHUB_ENV
              }
          } catch {}
          $global:LASTEXITCODE = 0
          exit 0

      # ───────────────────────────────────────────────
      # 9. LƯU TRẠNG THÁI MỞ PHIÊN LÊN GITHUB & HIỂN THỊ THÔNG TIN
      # ───────────────────────────────────────────────
      - name: 💾 Lưu trạng thái đầu phiên lên GitHub
        shell: pwsh
        env:
          WINDOWS_IMAGE: ${{ inputs.windows_image }}
        run: |
          $savePass = if ($env:RDP_PASS_SOURCE -eq 'secret') {$null } else { $env:RDP_PASS }$state = [ordered]@{
              user            = $env:RDP_USER
              sid             = (Get-LocalUser -Name $env:RDP_USER).SID.Value
              password        = $savePass
              passwordSource  = $env:RDP_PASS_SOURCE
              windowsImage    = $env:WINDOWS_IMAGE
              osBuild         = $env:OS_BUILD
              driveLetter     = $env:MOUNT_LETTER
              tailscaleIp     = $env:TAILSCALE_IP
              durationMinutes = [int]$env:TOTAL_MINUTES
              startUtc        = (Get-Date).ToUniversalTime().ToString('o')
              runId           = $env:GITHUB_RUN_ID
              lastUpdatedUtc  = (Get-Date).ToUniversalTime().ToString('o')
          }
          $state \vert{} ConvertTo-Json -Depth 5 \vert{} Set-Content -Path$env:SHARED_STATE_FILE -Encoding UTF8
          & (Join-Path $env:RUNNER_TEMP 'save-data.ps1') -Reason 'session-start'
          exit 0

      - name: 🎉 THÔNG TIN KẾT NỐI & Ổ ĐĨA HỆ THỐNG
        shell: pwsh
        run: |
          $tz    = [System.TimeZoneInfo]::FindSystemTimeZoneById('SE Asia Standard Time')$start = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTimeOffset]::FromUnixTimeSeconds([long]$env:JOB_START_EPOCH).UtcDateTime, $tz)
          $end   =$start.AddMinutes([int]$env:TOTAL_MINUTES)$passText = if ($env:RDP_PASS_SOURCE -eq 'secret') { '(dùng secret RDP_PASSWORD)' } else { $env:RDP_PASS }

          Write-Host ""
          Write-Host "┌──────────────────────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host "│         🎉 HỆ THỐNG Ổ ĐĨA GITHUB ĐÃ SẴN SÀNG!            │" -ForegroundColor Cyan
          Write-Host "├──────────────────────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "│ 🌐  IP Tailscale : $env:TAILSCALE_IP (Port: 3389)" -ForegroundColor White
          if ($env:DUCKDNS_HOST) { Write-Host "│ 🦆  Tên miền     : $env:DUCKDNS_HOST" -ForegroundColor White }
          if ($env:RUSTDESK_ID)  { Write-Host "│ 🖥️  RustDesk ID  : $env:RUSTDESK_ID  \vert{}  MK:$env:RUSTDESK_PASS_TEXT" -ForegroundColor White }
          Write-Host "│ 👤  Tài khoản    : $env:RDP_USER" -ForegroundColor White
          Write-Host "│ 🔐  Mật khẩu     : $passText" -ForegroundColor White
          Write-Host "│ 💽  Ổ đĩa riêng  : $($env:MOUNT_LETTER):\ ($env:SHARED_ROOT)" -ForegroundColor Green
          Write-Host "│ 👤  Profile gốc  : $env:PROFILE_PATH" -ForegroundColor Green
          Write-Host "│ 📦  Thư mục App  : C:\AISTV-Apps -> $($env:SHARED_OS_DIR)\InstalledApps" -ForegroundColor Green
          Write-Host "│ ⏰  Thời lượng   : $env:DISPLAY_TIME ($($start.ToString('HH:mm:ss')) -> $($end.ToString('HH:mm:ss')))" -ForegroundColor White
          Write-Host "├──────────────────────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "│ 💡 Toàn bộ ổ $($env:MOUNT_LETTER):\, Profile, App, Registry tự lưu thẳng vào GitHub" -ForegroundColor Yellow
          Write-Host "│ 💡 Không cần Restic/S3 ngoài - Tự động cắt mảnh & ghép khi chuyển phiên" -ForegroundColor Yellow
          Write-Host "└──────────────────────────────────────────────────────────┘" -ForegroundColor Cyan

      # ───────────────────────────────────────────────
      # 10. DUY TRÌ PHIÊN + AUTOSAVE ĐỊNH KỲ LÊN GITHUB
      # ───────────────────────────────────────────────
      - name: ⏳ DUY TRÌ PHIÊN LÀM VIỆC & ĐỒNG BỘ GITHUB
        id: keepalive
        shell: pwsh
        env:
          AUTOSAVE_MINUTES: '20'
        run: |
          $endEpoch   = [long]$env:JOB_START_EPOCH + ([long]$env:TOTAL_MINUTES * 60)
          $saveScript = Join-Path$env:RUNNER_TEMP 'save-data.ps1'
          $lastSave   = Get-Date$lastLog    = (Get-Date).AddHours(-1)
          $warned     =$false

          while ($true) {
              $now    = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()$remain = $endEpoch -$now
              if ($remain -le 0) { break }

              if (((Get-Date) - $lastLog).TotalMinutes -ge 5) {
                  $svc  = Get-Service -Name TermService -ErrorAction SilentlyContinue$conn = @(Get-NetTCPConnection -LocalPort 3389 -State Established -ErrorAction SilentlyContinue).Count
                  $h = [math]::Floor($remain / 3600); $m = [math]::Floor(($remain % 3600) / 60)
                  Write-Host "[$(Get-Date -Format 'HH:mm:ss')] 📊 RDP: $($svc.Status) | Kết nối: $conn | Còn lại: ${h}h${m}m" -ForegroundColor Blue
                  $lastLog = Get-Date
              }

              $svc = Get-Service -Name TermService -ErrorAction SilentlyContinue
              if ($svc -and$svc.Status -ne 'Running') {
                  Start-Service -Name TermService -ErrorAction SilentlyContinue
              }

              if (-not $warned -and$remain -le 300) {
                  try { msg * /TIME:290 "Phien RDP sap chuyen sang phien moi (con 5 phut). He thong se tu dong dong goi toan bo o dia $($env:MOUNT_LETTER): luu len GitHub!" } catch {}
                  $warned =$true
              }

              if ((((Get-Date) - $lastSave).TotalMinutes -ge [int]$env:AUTOSAVE_MINUTES) -and $remain -gt 240) { &$saveScript -Reason 'autosave'
                  $global:LASTEXITCODE = 0$lastSave = Get-Date
              }

              Start-Sleep -Seconds ([int][math]::Min(30, [math]::Max(1, $remain)))
          }
          Write-Host "🎯 ĐÃ HẾT THỜI GIAN PHIÊN - BẮT ĐẦU ĐÓNG GÓI TOÀN BỘ Ổ ĐĨA CHUYỂN PHIÊN!" -ForegroundColor Yellow
          exit 0

      # ───────────────────────────────────────────────
      # 11. LƯU TOÀN BỘ Ổ ĐĨA CUỐI PHIÊN LÊN GITHUB
      # ───────────────────────────────────────────────
      - name: 💾 Đóng gói & Lưu toàn bộ ổ đĩa lên GitHub trước khi chuyển phiên
        if: always()
        shell: pwsh
        run: |
          $saveScript = Join-Path$env:RUNNER_TEMP 'save-data.ps1'
          if (-not (Test-Path $saveScript)) { exit 0 }

          # Lưu lần 1 khi user còn trong phiên để trích xuất toàn bộ HKCU Registry đang mở
          & $saveScript -Reason 'pre-logoff'$global:LASTEXITCODE = 0

          # Đăng xuất user để Windows xả toàn bộ cache NTUSER.DAT và nhả khóa file SQLite/LevelDB của trình duyệt
          $u =$env:RDP_USER
          if ($u) {
              try {
                  (quser 2>$null) | Select-Object -Skip 1 | ForEach-Object {
                      $parts = (($_ -replace '^>', ' ').Trim()) -split '\s+'
                      if ($parts.Count -gt 1 -and$parts[0] -ieq $u) {$id = $parts[1..($parts.Count - 1)] | Where-Object { $_ -match '^\d+$' } | Select-Object -First 1
                          if ($id) { logoff$id 2>&1 | Out-Null }
                      }
                  }
                  Start-Sleep -Seconds 10
              } catch {}
          }

          # Lưu lần 2 (chốt hạ toàn bộ ổ đĩa sạch sẽ lên GitHub Release + Git Branch)
          & $saveScript -Reason 'session-end-final'$global:LASTEXITCODE = 0

          # Ngắt kết nối Tailscale gọn gàng nhưng KHÔNG xóa state để phiên mới giữ nguyên IP
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (Test-Path $ts) { &$ts down 2>&1 | Out-Null }
          exit 0

      # ───────────────────────────────────────────────
      # 12. TỰ ĐỘNG GỌI PHIÊN MỚI & MỞ LẠI Ổ ĐĨA
      # ───────────────────────────────────────────────
      - name: 🔁 Chuyển phiên tự động & Gọi lại ổ đĩa trên máy mới
        if: ${{ always() && inputs.auto_restart && steps.keepalive.outcome == 'success' }}
        shell: pwsh
        env:
          DURATION: ${{ inputs.duration }}
          WIN_IMAGE: ${{ inputs.windows_image }}
          USER_IN: ${{ inputs.rdp_user }}
          PKGS: ${{ inputs.choco_packages }}
          OPT: ${{ inputs.optimize_windows }}
          DDNS: ${{ inputs.enable_duckdns }}
          RD: ${{ inputs.enable_rustdesk }}
        run: |
          $wf = [System.IO.Path]::GetFileName(($env:GITHUB_WORKFLOW_REF -split '@')[0])
          Write-Host "🚀 Đang khởi chạy phiên kế tiếp và nạp lại ổ đĩa $($env:MOUNT_LETTER):\ từ GitHub..." -ForegroundColor Cyan
          gh workflow run $wf --ref$env:GITHUB_REF_NAME `
              -f "duration=$($env:DURATION)" `
              -f auto_restart=true `
              -f "drive_letter=$($env:MOUNT_LETTER)" `
              -f "vhd_size_gb=$($env:VHD_SIZE_GB)" `
              -f "windows_image=$($env:WIN_IMAGE)" `
              -f "rdp_user=$($env:USER_IN)" `
              -f "choco_packages=$($env:PKGS)" `
              -f "optimize_windows=$($env:OPT)" `
              -f "enable_duckdns=$($env:DDNS)" `
              -f "enable_rustdesk=$($env:RD)"
          if ($LASTEXITCODE -ne 0) { throw 'Không kích hoạt được phiên mới' }
          Write-Host "✅ Đã chuyển giao ổ đĩa sang phiên mới thành công!" -ForegroundColor Green
